<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מיפוי ותכנית עבודה בית ספרית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1d2433;--muted:#5d6678;--line:#e2e5eb;
  --brand:#2d5bd7;--brand-soft:#e9effc;--ok:#1f8a5b;--ok-soft:#e5f5ed;
  --warn:#b26a00;--warn-soft:#fdf2e0;--bad:#c23b3b;--bad-soft:#fbe9e9;
  --s1:#d9534f;--s2:#f0ad4e;--s3:#e8d44d;--s4:#8bc34a;--s5:#2e7d32;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171d;--card:#1d2129;--ink:#e8ebf1;--muted:#a3abba;--line:#323845;
  --brand:#7b9cff;--brand-soft:#253150;--ok:#5fcf98;--ok-soft:#1d3a2d;--warn:#f0b35a;--warn-soft:#3d2f17;--bad:#ff8a8a;--bad-soft:#432222;}
}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 0 0 12px}
.grow{flex:1}
select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;resize:vertical;min-height:58px}
input[type=text],input:not([type]){width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:12px 14px;white-space:nowrap;background:none;color:var(--muted)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
nav .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:12px;margin-left:6px}
nav button.on .num{background:var(--brand);color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px}
main.wide{max-width:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:18px}
.card h3{margin:0 0 6px;font-size:16px}
.lead{color:var(--muted);margin:0 0 12px}
.tip{background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.tip ul{margin:4px 0;padding-inline-start:20px}
.status{font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:right;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.level{margin-bottom:20px}
.level>h3{display:flex;align-items:center;gap:8px}
.stmt{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.stmt-head{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.stmt-head .t{flex:1}
.stmt-body{padding:4px 12px 12px;border-top:1px solid var(--line);display:none}
.stmt.open .stmt-body{display:block}
.scores{display:flex;gap:4px;flex-wrap:wrap}
.scores button{padding:4px 10px;font-size:13px}
.scores button.on[data-v="1"]{background:var(--s1);color:#fff;border-color:var(--s1)}
.scores button.on[data-v="2"]{background:var(--s2);color:#222;border-color:var(--s2)}
.scores button.on[data-v="3"]{background:var(--s3);color:#222;border-color:var(--s3)}
.scores button.on[data-v="4"]{background:var(--s4);color:#222;border-color:var(--s4)}
.scores button.on[data-v="5"]{background:var(--s5);color:#fff;border-color:var(--s5)}
.scores button.on[data-v="0"]{background:var(--muted);color:var(--card)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;background:var(--line)}
.dot.s1{background:var(--s1);color:#fff}.dot.s2{background:var(--s2);color:#222}.dot.s3{background:var(--s3);color:#222}.dot.s4{background:var(--s4);color:#222}.dot.s5{background:var(--s5);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
label.f small{color:var(--muted);opacity:.8}
.crit{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.crit label{display:flex;gap:6px;align-items:center;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:var(--brand)}
.plan-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--card)}
.plan-row .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.plan-row .hd .n{font-weight:700;color:var(--brand)}
.warns{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.warns div{font-size:13px;padding:4px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.warns div.good{background:var(--ok-soft);color:var(--ok)}
details.smart{margin-top:6px;font-size:14px}
details.smart summary{cursor:pointer;color:var(--brand)}
.check{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.ico{flex:none;width:22px;text-align:center;font-weight:700}
.ico.ok{color:var(--ok)}.ico.bad{color:var(--bad)}.ico.warn{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:30px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20}
.modal{background:var(--card);border-radius:12px;padding:20px;width:min(440px,92vw)}
.modal h3{margin-top:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:8px;z-index:30;font-size:14px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flow span{background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:8px;font-size:13px}
.flow b{color:var(--muted)}
.guide-sec{margin-bottom:14px}
.guide-sec h3{color:var(--brand)}
.guide-sec ul{margin:4px 0;padding-inline-start:22px}
.ex-bad{color:var(--bad)} .ex-good{color:var(--ok)}
.welcome{text-align:center;padding:50px 20px}
.welcome h2{font-size:22px}

/* work plan table – styled after the school template */
.xwrap{overflow-x:auto;border-radius:10px;border:1px solid #9db3d3;background:#fff}
.xplan{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1250px;color:#000;font-size:13.5px}
.xplan td,.xplan th{border:1px solid #9db3d3;padding:0;vertical-align:top;text-align:right}
.xplan .xt{background:#1F3864;color:#fff;font-weight:700;font-size:18px;padding:10px 14px}
.xplan .xs{background:#1F3864;color:#fff;font-size:13px;padding:6px 14px 10px}
.xplan .xh th{background:#2E75B6;color:#fff;font-weight:700;font-size:14px;padding:10px 8px;text-align:center;vertical-align:middle;position:sticky;top:0}
.xplan .xh th.hn,.xplan .xd td.hn{background:#1F3864}
.xplan .xd td{background:#DEEAF1;font-size:11.5px;font-weight:500;padding:6px 8px;color:#1d2433}
.xplan .pn{background:#DEEAF1;color:#1F3864;font-weight:700;font-size:16px;text-align:center;vertical-align:middle}
.xplan .po{padding:8px;background:#fff}
.xplan .po .ot{font-weight:700}
.xplan .po .ob{font-size:12px;color:#2E75B6;margin-top:6px}
.xplan .po select{width:100%;font-size:13px;background:#fff;color:#000}
.xplan .addsub{margin-top:8px;font-size:12px;padding:3px 8px;background:#fff;color:#2E75B6;border-color:#9db3d3}
.xplan .pc{position:relative;background:#fff}
.xplan .pc textarea,.xplan .pc select{width:100%;border:none;border-radius:0;background:transparent;color:#000;padding:8px;font-size:13.5px;resize:none;min-height:40px;overflow:hidden;line-height:1.45}
.xplan .pc textarea:focus,.xplan .pc select:focus{outline:2px solid #2E75B6;outline-offset:-2px;background:#f5f9ff}
.xplan .pc.ed{background:#fff8dc}
.xplan .rs{position:absolute;top:2px;left:2px;padding:0 5px;font-size:13px;line-height:18px;background:#fff;color:#2E75B6;border-color:#9db3d3;opacity:.75}
.xplan .rs:hover{opacity:1}
.xplan .gw{padding:0 8px 6px;font-size:11.5px;color:#b26a00}
.xplan .px{background:#fff;text-align:center;vertical-align:middle}
.xplan .px button{padding:2px 6px}
.xplan .empty{padding:30px;text-align:center;color:#5d6678}
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid #9db3d3;border-radius:3px;margin-left:6px;vertical-align:-2px}
.lg-auto{background:#fff}.lg-ed{background:#fff8dc}
</style>
</head>
<body>
<header>
  <h1>מיפוי ותכנית עבודה בית ספרית</h1>
  <select id="schoolSel" aria-label="בית ספר"></select>
  <button id="newSchool">+ בית ספר חדש</button>
  <span class="grow"></span>
  <span class="status" id="saveStatus"></span>
  <button id="exportBtn" class="primary" style="display:none">ייצוא ל-Excel</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="modalRoot"></div>
<datalist id="evid"></datalist>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" defer></script>
<script>
"use strict";
/* ---------- Reference data (from the attached files) ---------- */
const ZONES=["מנהיגות ותרבות בית ספרית","צוות חינוכי","הוראה-למידה-הערכה","למידה רגשית חברתית אקלים","חינוך חברתי","שותפויות עם הורים וקהילה","תשתיות ותשומות תומכות"];
const CORE=[0,1,2]; // שלוש זירות הליבה בכלי המיפוי
const TWO_SCORE=z=>z===1||z===2; // בזירות הצוות החינוכי והוראה-למידה-הערכה: שני ציונים
const RAW=[
 [0,"מנהל המוביל חזון בהיר המתורגם לתכנית עבודה",[
  "למנהל יש עמוד שדרה ניהולי ותפיסה חינוכית ברורה והוא מוביל את בית הספר לפי הנחות היסוד המפורטות להלן ברמת בית הספר וברמת הכיתות",
  "בבית הספר קיים חזון ברור הנשען על תפיסה פדגוגית ברורה של המנהל שבמרכזה עומדת רכישת האוריינות השפתית, המתאר תמונת עתיד ידועה, מוסכמת ומקובלת על ידי הצוות",
  "בבית הספר קיימת תכנית עבודה שנתית ורב שנתית התואמת את החזון הבית ספרי. התכנית מתארת את סדרי העדיפויות ומציגה יעדים מדידים, לצורך שיפור מתמיד"]],
 [0,"תרבות ארגונית תומכת",[
  "בבית הספר קיים מבנה ארגוני ברור הכולל הגדרות מפורטות של בעלי התפקידים המרכזיים, כאשר המאמנת היא חלק משמעותי מצוות זה",
  "בבית הספר קיימת מנהיגות ביניים השותפה ולוקחת אחריות בהובלת בית הספר",
  "עבודת ההנהלה ובעלי התפקידים מתנהלת על פי מטרות ויעדים ותכניות עבודה סדורות לקידומם",
  "בבית הספר קיימות סדירויות המאפשרות את קידומם של היעדים ומעוגנות במערכת השעות"]],
 [0,"עיצוב תחושת מסוגלות ואחריות",[
  "המנהל רותם את הצוות למימוש התפיסה החינוכית הבית ספרית, מטפח אחריות משותפת ומעודד יזמות אישית"]],
 [0,"המנהל כמנהיג פדגוגי",[
  "המנהל מקדיש תשומת לב מרכזית לתהליכי הוראה-למידה של המורים והתלמידים",
  "המנהל וצוות המנהיגות כולל המאמנת מנתחים נתונים, מסיקים מסקנות, מגדירים יעדים ומקבלים החלטות פדגוגיות בהתאם",
  "המנהל מבין את העקרונות הפדגוגיים שנבנו במסגרת תהליך השינוי בשפה, ופועל בהדרגה להעברת העקרונות, המנגנונים ודרכי העבודה לתחומים, מקצועות ושכבות נוספים",
  "המנהל מכיר את המתרחש בכיתות באמצעות הליכה לימודית, תצפיות, שיח עם מורים ובחינת תוצרי למידה. מתקיים קשר בין מה שהוא רואה לבין סדר היום הפדגוגי שהוא מוביל",
  "המנהל מקדם פתרונות לצרכים של הצוות שיתמכו בהשגת היעדים של בית הספר",
  "המנהל מקדם בבית הספר עבודה על בסיס תכניות עבודה וקבלת החלטות מבוססת נתונים"]],
 [0,"המנהל מציב רף גבוה לצוות ולתלמידים",[
  "המנהל מציב לצוות רף ציפיות גבוה ומקדם פתרונות לצרכים של הצוות שיתמכו בהשגת היעדים",
  "המנהל מציב לתלמידים רף גבוה של ציפיות להישגים ומאמין ביכולותיהם להגיע להישגים אקדמיים גבוהים"]],
 [1,"תחושת שייכות ומחויבות של הצוות החינוכי",[
  ["בקרב הצוות החינוכי קיימת תחושת שייכות גבוהה לבית הספר וגאוות יחידה","A"],
  ["הצוות החינוכי מחויב לבית הספר ולוקח על עצמו תפקידים ומשימות, כולל משימות שאינן קשורות באופן ישיר לתחום אחריותו","A"]]],
 [1,"תחושת מסוגלות צוותית",[
  "המורים בעלי תחושת מסוגלות גבוהה ואמון ביחס ליכולות שלהם כצוות לקדם את כלל התלמידים ולעזור לכלל התלמידים לפתח את יכולותיהם",
  "לצוות המורים יש תפיסה חינוכית מגובשת והבנה משותפת כיצד לממש את התפיסה החינוכית באמצעות תהליכי הוראה-למידה",
  "הצוות מרגיש שהוא מסוגל לאתר ולספק מענים לצרכים השונים של התלמידים (רגשיים, חברתיים, לימודיים)"]],
 [1,"מקצועיות הצוות החינוכי",[
  "המורים מתנהלים על פי שגרה סדורה מבוססת נתונים המבטאת מקצועיות בעבודת ההוראה: תכנון ההוראה על בסיס מטרות, ביצוע מיפויים, בקרה אחר התקדמות התלמידים, מתן מענה לקשיים, הערכת אפקטיביות",
  "הצוות החינוכי מקיים שיח חינוכי קבוע לאיתור ולהבנה של האתגרים הלימודיים, החברתיים והרגשיים של תלמידים ולגיבוש דרכי ההתמודדות איתם",
  ["בבית הספר מתקיים תהליך פיתוח מקצועי איכותי ורלוונטי לצרכי הצוות – אישי וצוותי. הצוות שותף בהבניית מסלולי ההתפתחות המקצועית שלו","A"]]],
 [1,"קהילה מקצועית לומדת",[
  "הצוות לומד באופן שיטתי מתוך העשייה שלו, ישנו אמון מקצועי בין אנשי הצוות, מתקיימות תצפיות, למידת עמיתים, נכונות לחשיפת קשיים, לקיחת אחריות משותפת בניתוח פרקטיקות הוראה ותוצרי למידה וקבלת משוב לשם שיפור ההוראה"]],
 [1,"סביבת עבודה תומכת ומצמיחה",[
  ["בבית הספר קיימים מענים איכותיים וזמינים לצוות בתחום הפדגוגי","A"],
  ["בית הספר משקיע בלכידות החברתית והגיבוש של חברי הצוות","A"]]],
 [2,"יישום פרקטיקות הוראה",[
  "אוריינות שפתית היא הליבה של תהליכי הלימוד: חשיפה לעושר לשוני, התנסות פעילה אינטנסיבית בסביבות אורייניות לתלמידים, השיעורים מבוססים על שיח עשיר בו התלמידים שותפים פעילים ומרכזיים",
  "ההוראה מתוכננת סביב רכישת מיומנויות: נעשה שימוש בפרקטיקות הוראה מקדמות למידה, קיימת מעורבות פעילה של התלמידים, המורה מנתחת את אפקטיביות ההוראה ומתאימה אותה לשיפור תהליכי הלמידה",
  "מתקיימים תהליכי הוראה דיפרנציאליים דינמיים (ולא שימוש קבוע בקבוצות הומוגניות) כדי לתמוך בהתקדמות התלמידים בהיבטים לימודיים, רגשיים וחברתיים",
  "ההוראה בבית הספר מגוונת במסגרות הלמידה (מליאה, קבוצה, פרטני), יש בה גמישות ויצירתיות בסביבות הלמידה (למידה חוץ כיתתית, יחידות זמן מותאמות מטרה), במערכי השיעור ובחומרי הלימוד",

const OUTCOMES=[];const COMPS=[];
RAW.forEach(([zone,comp,items],ci)=>{COMPS.push({zone,comp,ci});items.forEach((it,k)=>{const [text,na]=Array.isArray(it)?it:[it,""];OUTCOMES.push({id:"z"+zone+"c"+ci+"s"+k,zone,comp,text,naA:na==="A",naB:na==="B"})})});
const SCORE_LABEL={0:"אין מספיק מידע",1:"כלל לא",2:"במידה מועטה",3:"במידה בינונית",4:"במידה רבה",5:"במידה רבה מאוד"};
const ACTION_TYPES=["פעולת בית הספר","פעולת המלווה/המנחה","פעולה משותפת"];
const TOOLS=["ראיונות אישיים","קבוצות מיקוד","שאלונים","תצפיות בישיבות הנהלה","תצפיות בכיתות","תצפיות בישיבות צוות","קריאת מסמכים"];
const EVID=["מערכת שעות אישית של מורים ובעלי תפקידים","הגדרות תפקידים","דיווח עצמי של מורים ושל בעלי תפקידים","סיכומי ישיבות","תכנית עבודה","תכנית פיתוח מקצועי אישית של המורים","תכנית פיתוח מקצועי צוותית","מסמך חזון","מסמך תפיסה חינוכית/ערכים מובילים","תכנון הוראה (שבועי, חודשי, מערכי שיעור)","מיפויים של הישגי תלמידים"];
const CRIT=[["imp","משמעותי לשינוי"],["urg","פער דחוף"],["feas","ניתן לקדם השנה"],["wide","השפעה רחבה"]];

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function blankSchool(name,year){return {name,year:year||"",createdAt:Date.now(),updatedAt:Date.now(),prep:[],map:{},custom:[],snap:{},zoneCh:{},plan:[],align:{}}}
function allOutcomes(S){return OUTCOMES.concat((S.custom||[]).map(c=>({...c,custom:true})))}
function outcomeById(S,id){return allOutcomes(S).find(o=>o.id===id)}
function mapOf(S,id){S.map[id]=S.map[id]||{score:null,scoreA:null,evidence:"",tools:"",selected:false,crit:{}};return S.map[id]}
/* score keys that apply to a statement: scoreA = צוות השפה, score = בית הספר כללי */
function keysOf(o){if(!TWO_SCORE(o.zone))return ["score"];const k=[];if(!o.naA)k.push("scoreA");if(!o.naB)k.push("score");return k}
function valsOf(o){const m=S.map[o.id];if(!m)return [];return keysOf(o).map(k=>m[k]).filter(v=>v!=null)}
function lowOf(o){const v=valsOf(o).filter(x=>x>0);return v.length?Math.min(...v):null}
function isScored(o){return valsOf(o).length>0}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function scoreText(o){const m=S.map[o.id]||{};return keysOf(o).map(k=>m[k]==null?"":(keysOf(o).length>1?(k==="scoreA"?"צוות השפה: ":"בית הספר: "):"")+(m[k]?m[k]+" – ":"")+SCORE_LABEL[m[k]]).filter(Boolean).join(" | ")}

/* ---------- Storage: shared db when available, otherwise this browser ---------- */
const store={mode:"local",db:null,listUnsub:null,docUnsub:null,
  localAll(){try{return JSON.parse(localStorage.getItem("mapplan.schools")||"{}")}catch(e){return {}}},
  localPut(all){try{localStorage.setItem("mapplan.schools",JSON.stringify(all))}catch(e){}},
};
let schools={};        // id -> {name,year,updatedAt}
let curId=null, S=null; // current school data
let tab="prep";
let dirty=false, saving=false, lastEdit=0, saveTimer=null;

function setStatus(t){$("#saveStatus").textContent=t}

async function initStore(){
  renderAll();
  let db=null;
  try{ if(window.claude&&claude.use) db=await claude.use("db"); }catch(e){db=null}
  if(db){
    store.mode="db";store.db=db;
    let timer=setTimeout(()=>setStatus("לא ניתן להתחבר לשמירה המשותפת כרגע"),10000);
    store.listUnsub=db.collection("schools").onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer)}
      const next={};snap.docs.forEach(d=>{const v=d.data()||{};next[d.id]={name:v.name||"ללא שם",year:v.year||"",updatedAt:v.updatedAt||0,data:v}});
      schools=next;
      if(curId&&schools[curId]&&!dirty&&!saving&&Date.now()-lastEdit>4000){
        const remote=schools[curId].data; if(!S||remote.updatedAt>(S.updatedAt||0)){S=structuredClone(remote);renderView()}
      }
      if(curId&&!schools[curId]&&!dirty){curId=null;S=null}
      if(!curId){const ids=sortedIds(); if(ids.length) openSchool(ids[0],true)}
      renderHeader(); if(!S) renderView();
      setStatus(snap.metadata.fromCache?"טוען…":"נשמר בשרת – משותף לכל מי שהדף שותף איתו");
    },err=>{clearTimeout(timer);setStatus("השמירה המשותפת לא זמינה – הנתונים נשמרים בדפדפן זה");fallbackLocal()});
  } else fallbackLocal();
}
function fallbackLocal(){
  store.mode="local";const all=store.localAll();schools={};
  for(const id in all) schools[id]={name:all[id].name,year:all[id].year,updatedAt:all[id].updatedAt,data:all[id]};
  if(!curId){const ids=sortedIds(); if(ids.length) openSchool(ids[0],true)}
  setStatus("נשמר בדפדפן זה בלבד");renderAll();
}
function sortedIds(){return Object.keys(schools).sort((a,b)=>(schools[b].updatedAt||0)-(schools[a].updatedAt||0))}
function openSchool(id,silent){curId=id;S=structuredClone(schools[id].data);S.prep=S.prep||[];S.map=S.map||{};S.custom=S.custom||[];S.snap=S.snap||{};S.zoneCh=S.zoneCh||{};S.plan=S.plan||[];S.align=S.align||{};try{localStorage.setItem("mapplan.cur",id)}catch(e){} if(!silent)renderAll()}

function touch(structural){dirty=true;lastEdit=Date.now();S.updatedAt=Date.now();setStatus("שומר…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);if(structural)renderView()}
async function flush(){
  if(!S||!curId)return; if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,800);return}
  saving=true;dirty=false;const id=curId,data=structuredClone(S);
  try{
    if(store.mode==="db"){await store.db.doc("schools/"+id).set(data);setStatus("נשמר ✓ (משותף)")}
    else{const all=store.localAll();all[id]=data;store.localPut(all);schools[id]={name:data.name,year:data.year,updatedAt:data.updatedAt,data};setStatus("נשמר בדפדפן זה ✓")}
  }catch(e){
    dirty=true;
    if(e&&e.code==="invalid_argument"){setStatus("אין לך הרשאת עריכה בדף זה – השינויים לא נשמרו")}
    else if(e&&e.code==="quota_exceeded"){setStatus("נגמר מקום האחסון – מחקו בתי ספר ישנים")}
    else{setStatus("השמירה נכשלה, מנסה שוב…");setTimeout(flush,3000)}
  }finally{saving=false}
}
async function createSchool(name,year){
  const id="s"+uid(),data=blankSchool(name,year);
  schools[id]={name,year,updatedAt:data.updatedAt,data};curId=id;S=structuredClone(data);tab="prep";
  dirty=true;await flush();renderAll();
}
async function deleteSchool(){
  if(!curId)return;const id=curId;
  try{
    if(store.mode==="db") await store.db.doc("schools/"+id).delete();
    else{const all=store.localAll();delete all[id];store.localPut(all)}
    delete schools[id];curId=null;S=null;const ids=sortedIds();if(ids.length)openSchool(ids[0],true);renderAll();toast("בית הספר נמחק");
  }catch(e){toast("המחיקה נכשלה")}
}

  $("#mCancel").onclick=()=>root.innerHTML="";

/* ---------- 2. Mapping ---------- */
let mapZone=0;
function viewMap(){
  const all=allOutcomes(S);const scored=all.filter(isScored).length;

  <br><b>בזירות הצוות החינוכי והוראה-למידה-הערכה</b> יש לחלק מההיגדים שני ציונים: הראשון – מידת הביסוס בצוות השפה; השני – מידת ההעברה, ההתאמה והיישום בצוותים, שכבות ותחומי דעת נוספים (מצב כללי של בית הספר). כל ציון מבוסס על עדויות מהאוכלוסייה הרלוונטית.
  <br><b>כשיש מחלוקת:</b> על אילו עדויות כל אחד מסתמך? האם ההיגד מפורש באותו אופן? קיום הפעולה או איכותה? נקודתי או שגרה? הערכת המצב או הדחיפות?</div></div>

  });

function stmtCard(o){
  const m=S.map[o.id]||{};const ks=keysOf(o);
  const dots=ks.map(k=>{const v=m[k];return `<span class="dot ${v?"s"+v:""}" title="${k==="scoreA"?"צוות השפה":"בית הספר"}">${v==null?"–":v===0?"?":v}</span>`}).join("");
  const two=ks.length>1;
  const btns=ks.map(k=>scoreButtons(o,k,TWO_SCORE(o.zone)?(k==="scoreA"?"ניקוד מצב קיים – צוות השפה":"ניקוד מצב עדכני כללי של בית הספר"):"ניקוד המבטא מצב עדכני כללי של בית הספר")).join("");
  const na=TWO_SCORE(o.zone)&&(o.naA||o.naB)?`<div class="status">${o.naA?"ניקוד צוות השפה: לא רלוונטי":"ניקוד כללי של בית הספר: לא רלוונטי"}</div>`:"";
  return `<div class="stmt ${openStmts.has(o.id)?"open":""}" data-stmt="${o.id}">
   <div class="stmt-head" data-toggle="${o.id}">${dots}<span class="t">${esc(o.text)}</span>
   ${m.selected?`<span class="pill ok">נבחר לתכנית</span>`:""}${(m.evidence||"").trim()?`<span class="pill">יש עדויות</span>`:""}</div>
   <div class="stmt-body">${btns}${na}
    <div class="grid2">
     <div><label class="f">כלי איסוף הנתונים</label><input data-map="${o.id}" data-k="tools" value="${esc(m.tools)}" list="tools" placeholder="תצפיות בכיתות, ראיונות…"></div>
     <div><label class="f">מקורות / מסמכים שנבדקו</label><input data-map="${o.id}" data-k="sources" value="${esc(m.sources)}" list="evid" placeholder="סיכומי ישיבות, תכנית עבודה…"></div>
    </div>
    <label class="f">עדויות – מה מצאנו בפועל <small>(למשל: בשלושה מארבעת הפרוטוקולים לא תועדה החלטה פדגוגית)</small></label>

/* ---------- 3. Snapshot & selection ---------- */
function viewSnap(){
  const all=allOutcomes(S);
  const strengths=all.filter(o=>lowOf(o)>=4);
  const gaps=all.filter(o=>lowOf(o)!=null&&lowOf(o)<=2).sort((a,b)=>lowOf(a)-lowOf(b));
  const unknown=all.filter(o=>valsOf(o).includes(0));
  const candidates=all.filter(o=>isScored(o)&&!(lowOf(o)>=5));
  const critScore=o=>CRIT.filter(([k])=>S.map[o.id].crit&&S.map[o.id].crit[k]).length;
  candidates.sort((a,b)=>critScore(b)-critScore(a)||(lowOf(a)||9)-(lowOf(b)||9));
  const selCount=all.filter(o=>S.map[o.id]&&S.map[o.id].selected).length;
  const li=o=>`<li>${esc(o.text)} <span class="pill">${esc(scoreText(o))}</span></li>`;
  const bar=(v)=>`<div class="bar"><i style="width:${v?v/5*100:0}%"></i></div><b style="width:36px">${v?v.toFixed(1):"–"}</b>`;
  const summary=CORE.map(z=>{
    const rows=COMPS.filter(c=>c.zone===z).map(c=>{const it=all.filter(o=>o.zone===z&&o.comp===c.comp);
      const gB=avg(it.map(o=>S.map[o.id]&&!o.naB?S.map[o.id].score:null).filter(v=>v>0));
      const gA=TWO_SCORE(z)?avg(it.map(o=>S.map[o.id]&&!o.naA?S.map[o.id].scoreA:null).filter(v=>v>0)):null;
      return `<div class="row" style="margin-bottom:4px"><span style="width:230px;font-size:14px">${esc(c.comp)}</span>${TWO_SCORE(z)?`<span class="status" style="width:70px">צוות השפה</span>${bar(gA)}`:""}<span class="status" style="width:70px">בית הספר</span>${bar(gB)}</div>`}).join("");
    return `<div style="margin-bottom:14px"><h3>${ZONES[z]}</h3>${rows}</div>`}).join("");
  return `<div class="card"><h2>ריכוז זירות – מציונים לתמונת מצב</h2>
   <p class="lead">ממוצע הניקוד לכל רכיב (סולם 1–5, ללא היגדים שסומנו "אין מספיק מידע").</p>${summary}</div>
  <div class="card"><div class="grid2">
    <div><h3>כוחות שאפשר להישען עליהם (4–5)</h3>${strengths.length?`<ul>${strengths.map(li).join("")}</ul>`:`<p class="status">אין עדיין</p>`}</div>
    <div><h3>פערים (1–2)</h3>${gaps.length?`<ul>${gaps.map(li).join("")}</ul>`:`<p class="status">אין עדיין</p>`}
    ${unknown.length?`<h3>מידע חסר</h3><ul>${unknown.map(o=>`<li>${esc(o.text)}</li>`).join("")}</ul>`:""}</div>
  </div>${CORE.some(z=>(S.zoneCh[z]||"").trim())?`<h3>אתגרים מרכזיים שתועדו</h3><ul>${CORE.filter(z=>(S.zoneCh[z]||"").trim()).map(z=>`<li><b>${ZONES[z]}:</b> ${esc(S.zoneCh[z])}</li>`).join("")}</ul>`:""}</div>
  <div class="card"><h3>שאלות לשיח על תמונת המצב</h3><div class="grid2">
   ${[["strengths","מהם הכוחות שעליהם אפשר להישען?"],["gaps","מהם הפערים המרכזיים?"],["missing","האם יש מידע שחסר לנו?"],["meaningful","אילו פערים משמעותיים לתהליך השינוי, ולא רק נמוכים מבחינה מספרית?"],["routines","אילו סדירויות כבר קיימות?"],["practices","אילו פרקטיקות טובות אפשר להרחיב?"]].map(([k,q])=>`<div><label class="f">${q}</label><textarea data-snap="${k}">${esc(S.snap[k])}</textarea></div>`).join("")}
  </div></div>
  <div class="card"><h2>בחירת היגדים שיהוו בסיס לתוצאות בתכנית</h2>
   <p class="lead">לא כל היגד שקיבל ציון נמוך הופך אוטומטית לאתגר מרכזי. סמנו את הקריטריונים לכל מועמד ובחרו מספר מצומצם של תוצאות. <span class="pill ${selCount>5?"warn":"brand"}">נבחרו ${selCount}</span>${selCount>5?` <span class="status">מומלץ לצמצם</span>`:""}</p>
   ${candidates.length?`<div class="tablewrap"><table><thead><tr><th>היגד</th><th>ניקוד</th><th>קריטריונים</th><th>בחירה</th></tr></thead><tbody>
   ${candidates.map(o=>{const m=S.map[o.id];return `<tr><td>${esc(o.text)}<div class="status">${ZONES[o.zone]} · ${esc(o.comp)}</div></td><td style="white-space:nowrap">${keysOf(o).map(k=>m[k]==null?"":`<span class="dot ${m[k]?"s"+m[k]:""}" style="display:inline-grid" title="${k==="scoreA"?"צוות השפה":"בית הספר"}">${m[k]||"?"}</span>`).join(" ")}</td>
     <td><div class="crit">${CRIT.map(([k,l])=>`<label><input type="checkbox" data-crit="${o.id}" data-k="${k}" ${m.crit&&m.crit[k]?"checked":""}>${l}</label>`).join("")}</div></td>
     <td><label class="row"><input type="checkbox" data-select="${o.id}" ${m.selected?"checked":""}>לתכנית</label></td></tr>`}).join("")}</tbody></table></div>`:`<p class="empty">יש לנקד היגדים בלשונית "מיפוי" כדי שיופיעו כאן.</p>`}
   <div class="tip" style="margin-top:12px"><b>קריטריונים:</b> עד כמה ההיגד משמעותי לשינוי · עד כמה הפער דחוף (חוזר במקורות שונים? מה יקרה אם לא נטפל?) · עד כמה ניתן לקדם השנה (מוכנות, מעגל השפעה, אפשרות מעקב) · היגד בעל השפעה רחבה.</div>
   ${selCount?`<button class="primary" id="toPlan">המשך לתכנית העבודה ←</button>`:""}
  </div>`;
}

/* ---------- Export ---------- */
const PHEAD=["מס'","תוצאה רצויה מתוך כלי המיפוי"].concat(PF.map(x=>x[1]));
function planAOA(){
  syncPlan();const rows=[PHEAD];let n=0;
  planGroups().forEach(g=>{n++;const o=outcomeById(S,g.outcome);g.rows.forEach(r=>rows.push([n,o?o.text:""].concat(PF.map(([k])=>val(r,k)||""))))});
  return rows;
}
async function exportXlsx(){
  if(!window.XLSX){toast("רכיב הייצוא עדיין נטען, נסו שוב בעוד רגע");return}
  syncPlan();
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  const B={style:"thin",color:{rgb:"9DB3D3"}},border={top:B,bottom:B,left:B,right:B};
  const st=(fill,color,bold,sz,center)=>({fill:fill?{patternType:"solid",fgColor:{rgb:fill}}:undefined,font:{name:"Arial",bold:!!bold,sz:sz||10,color:{rgb:color||"000000"}},alignment:{wrapText:true,vertical:center?"center":"top",horizontal:center?"center":"right",readingOrder:2},border});
  const styleRange=(ws,r0,r1,c0,c1,s)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const a=XLSX.utils.encode_cell({r,c});ws[a]=ws[a]||{t:"s",v:""};ws[a].s=s}};
  // --- plan sheet, same layout as the school template ---
  const aoa=[[`תכנית עבודה בית ספרית – ${S.name}${S.year?" "+S.year:""}`],["מסמך זה מגדיר את התוצאות השנתיות הרוחביות לבית הספר. כל פעולה בתכנית העבודה חייבת להיות מקושרת לפחות לאחת מתוצאות אלה. יש לוודא בסיום כתיבת התכנית כי כל תוצאה ממפת התוצאות מקושרת לפחות לפעולה אחת שתביא למימושה."],[],PHEAD,["",PDESC.outcome].concat(PF.map(([k])=>PDESC[k]))];
  const merges=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}];
  let n=0;const groups=planGroups();
  groups.forEach(g=>{n++;const o=outcomeById(S,g.outcome);const start=aoa.length;g.rows.forEach((r,ri)=>aoa.push([ri?"":n,ri?"":(o?o.text:"")].concat(PF.map(([k])=>val(r,k)||""))));
    if(g.rows.length>1){merges.push({s:{r:start,c:0},e:{r:start+g.rows.length-1,c:0}},{s:{r:start,c:1},e:{r:start+g.rows.length-1,c:1}})}});
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!merges"]=merges;
  ws["!cols"]=[6,52,20,30,45,38,36,22,22].map(w=>({wch:w}));
  ws["!rows"]=[{hpt:28},{hpt:44},{hpt:6},{hpt:30},{hpt:120}];
  styleRange(ws,0,0,0,8,st("1F3864","FFFFFF",true,14));styleRange(ws,1,1,0,8,st("1F3864","FFFFFF",false,11));
  styleRange(ws,3,3,0,0,st("1F3864","FFFFFF",true,11,true));styleRange(ws,3,3,1,8,st("2E75B6","FFFFFF",true,11,true));
  styleRange(ws,4,4,0,0,st("1F3864","FFFFFF",true,10));styleRange(ws,4,4,1,8,st("DEEAF1","000000",true,9));
  if(aoa.length>5){styleRange(ws,5,aoa.length-1,0,0,st("DEEAF1","1F3864",true,12,true));styleRange(ws,5,aoa.length-1,1,1,st("FFFFFF","000000",true,10));styleRange(ws,5,aoa.length-1,2,8,st("FFFFFF","000000",false,10))}
  XLSX.utils.book_append_sheet(wb,ws,"תכנית עבודה בית ספרית");
  // --- mapping, summary, preparation ---
  const add=(aoa,name,widths)=>{const w=XLSX.utils.aoa_to_sheet(aoa);w["!cols"]=widths.map(x=>({wch:x}));const rng=XLSX.utils.decode_range(w["!ref"]);styleRange(w,0,0,0,rng.e.c,st("2E75B6","FFFFFF",true,11,true));if(rng.e.r>0)for(let r=1;r<=rng.e.r;r++)for(let c=0;c<=rng.e.c;c++){const a=XLSX.utils.encode_cell({r,c});if(w[a])w[a].s=st(null,"000000",false,10)}XLSX.utils.book_append_sheet(wb,w,name)};
  const mapRows=[["זירה","רכיב בזירה","מרכיבים מרכזיים","ניקוד צוות השפה","ניקוד מצב כללי של בית הספר","עדויות","כלי איסוף הנתונים","מקורות","נבחר לתכנית"]];
  const sv=(o,k)=>{const m=S.map[o.id]||{};if(!keysOf(o).includes(k))return TWO_SCORE(o.zone)?"לא רלוונטי":"";const v=m[k];return v==null?"":v===0?"אין מספיק מידע":v};
  allOutcomes(S).forEach(o=>{const m=S.map[o.id]||{};mapRows.push([ZONES[o.zone],o.comp,o.text,TWO_SCORE(o.zone)?sv(o,"scoreA"):"",sv(o,"score"),m.evidence||"",m.tools||"",m.sources||"",m.selected?"כן":""])});
  mapRows.push([]);mapRows.push(["אתגרים מרכזיים בזירה"]);CORE.forEach(z=>mapRows.push([ZONES[z],S.zoneCh[z]||""]));
  add(mapRows,"מיפוי",[22,28,60,12,14,45,25,25,10]);
  const sum=[["זירה","רכיב בזירה","ממוצע צוות השפה","ממוצע בית הספר"]];
  COMPS.forEach(c=>{const it=allOutcomes(S).filter(o=>o.zone===c.zone&&o.comp===c.comp);const f=k=>{const a=avg(it.filter(o=>keysOf(o).includes(k)).map(o=>(S.map[o.id]||{})[k]).filter(v=>v>0));return a?+a.toFixed(2):""};sum.push([ZONES[c.zone],c.comp,TWO_SCORE(c.zone)?f("scoreA"):"",f("score")])});
  add(sum,"ריכוז זירות",[25,40,16,16]);
  const prep=[["היגד או רכיב","איזה מידע דרוש?","ממי או מאיפה?","כלי האיסוף","מי אוסף?","עד מתי?"]].concat(S.prep.map(r=>{const o=outcomeById(S,r.stmt);return [o?o.text:"",r.info||"",r.source||"",r.tool||"",r.who||"",r.due||""]}));
  add(prep,"היערכות למיפוי",[50,30,25,25,15,15]);
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const fname=`תכנית עבודה - ${S.name}.xlsx`;
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:fname,data:new Blob([out])});toast("הקובץ נשמר")}catch(e){if(e&&e.code!=="declined")toast("השמירה לא זמינה כאן – אפשר להשתמש ב'העתקת התכנית כטבלה'")}}
  else{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out]));a.download=fname;a.click()}catch(e){toast("ההורדה לא זמינה כאן")}}
}
async function copyPlan(){
  const tsv=planAOA().map(r=>r.map(c=>String(c).replace(/[\t\n]+/g," ")).join("\t")).join("\n");
  try{await navigator.clipboard.writeText(tsv);toast("הועתק – אפשר להדביק ב-Excel")}catch(e){toast("ההעתקה נחסמה בדפדפן")}
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{

  if(d.delprep){S.prep.splice(+d.delprep,1);touch(true);return}

  if(d.delcustom){S.custom=S.custom.filter(c=>c.id!==d.delcustom);delete S.map[d.delcustom];touch(true);return}
  if(t.id==="toPlan"){tab="plan";renderTabs();renderView();scrollTo(0,0);return}
  if(t.id==="addPlan"){S.plan.push({id:uid(),outcome:"",auto:false,ov:{}});touch(true);return}
  if(d.addsub){S.plan.push({id:uid(),outcome:d.addsub,auto:false,ov:{}});touch(true);return}
  if(d.delrow){const r=S.plan.find(x=>x.id===d.delrow);if(!r)return;modal(`<h3>מחיקת השורה?</h3>${r.auto?"<p>זוהי שורה שנוצרה אוטומטית מהמיפוי. התוצאה תוסר מהתכנית (אפשר לשחזר).</p>":""}`,()=>{if(r.auto){cfg().hidden.push(r.outcome);S.plan=S.plan.filter(x=>x.outcome!==r.outcome||!x.auto)}else S.plan=S.plan.filter(x=>x!==r);touch(true)});return}
  if(d.reset){const r=S.plan.find(x=>x.id===d.reset);if(r){delete r.ov[d.k];touch(true)}return}
  if(t.id==="unhide"){cfg().hidden=[];touch(true);return}

});
