name: RLS tests

on:
  push:
    paths:
      - "supabase/sql/**"
      - "supabase/tests/**"
      - ".github/workflows/rls-tests.yml"
  pull_request:
    paths:
      - "supabase/sql/**"
      - "supabase/tests/**"
      - ".github/workflows/rls-tests.yml"

jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres \
            -f supabase/tests/rls_head_office.sql
