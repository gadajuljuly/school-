<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פרויקטי משימות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #e7e2d3;
    --paper: #fbf7ee;
    --paper-alt: #eee6d2;
    --rule: #c2d9ec;
    --margin: #d98a90;
    --ink: #2c2a24;
    --ink-muted: #918a78;
    --accent: #35618f;
    --accent-contrast: #fdfbf5;
    --danger: #b6473f;
    --high: #c0392b;
    --medium: #b8811f;
    --low: #3c8a5c;
    --shadow: rgba(44, 42, 36, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #101114;
      --paper: #242219;
      --paper-alt: #2c2a20;
      --rule: #3a4652;
      --margin: #8a4b50;
      --ink: #ece5d6;
      --ink-muted: #a49a85;
      --accent: #7fb0e0;
      --accent-contrast: #16181c;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --desk: #101114;
    --paper: #242219;
    --paper-alt: #2c2a20;
    --rule: #3a4652;
    --margin: #8a4b50;
    --ink: #ece5d6;
    --ink-muted: #a49a85;
    --accent: #7fb0e0;
    --accent-contrast: #16181c;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Assistant", "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--desk);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .app {
    max-width: 620px;
    margin: 0 auto;
  }

  .notebook {
    background: var(--paper);
    border-radius: 10px;
    box-shadow: 0 18px 40px var(--shadow);
  }

  .notebook-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 10px;
  }
  .notebook-date {
    font-family: "Rubik", "Assistant", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notebook-progress {
    font-size: 0.8rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .menu-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--ink);
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-btn:hover { background: var(--paper-alt); }

  .menu-panel {
    position: absolute;
    top: 42px;
    left: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: 0 10px 26px var(--shadow);
    padding: 10px;
    width: 200px;
    z-index: 5;
  }
  .menu-panel[hidden] { display: none; }
  .menu-section + .menu-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .menu-label {
    font-size: 0.72rem;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .menu-panel .filters { display: flex; flex-direction: column; gap: 4px; }
  .menu-panel button {
    width: 100%;
    text-align: right;
    padding: 7px 10px;
    border-radius: 6px;
    border: none;
    background: none;
    color: var(--ink);
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
  }
  .menu-panel button:hover { background: var(--paper-alt); }
  .menu-panel button.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .menu-panel button.danger { color: var(--danger); }

  .sheets-row {
    background: var(--paper-alt);
    border-bottom: 1px solid var(--rule);
    padding: 8px 10px 0;
    display: flex;
    align-items: flex-end;
    gap: 6px;
  }
  .sheets-bar {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  .sheets-bar::-webkit-scrollbar { display: none; }
  .sheet-tab {
    flex-shrink: 0;
    padding: 7px 16px;
    margin-bottom: -1px;
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.83rem;
    cursor: pointer;
    white-space: nowrap;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
    border-bottom: 1px solid var(--rule);
    border-radius: 5px 5px 0 0;
  }
  .sheet-tab:hover:not(.active) {
    background: rgba(0, 0, 0, 0.05);
    color: var(--ink);
  }
  .sheet-tab.active {
    background: var(--paper);
    color: var(--ink);
    font-weight: 700;
    border-color: var(--rule) var(--rule) var(--paper);
  }
  .sheet-tab input.rename-input {
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 80px;
    outline: none;
    border-bottom: 1px solid currentColor;
  }
  .add-sheet-tab {
    color: var(--accent);
    font-weight: 700;
    font-family: inherit;
  }
  .add-sheet-tab:hover {
    color: var(--accent);
  }

  .ruled-body {
    position: relative;
    background-image: repeating-linear-gradient(
      var(--paper) 0,
      var(--paper) 20px,
      var(--rule) 20px,
      var(--rule) 21px,
      var(--paper) 21px,
      var(--paper) 36px
    );
    border-radius: 0 0 10px 10px;
    padding: 20px 22px 4px 44px;
  }
  .ruled-body::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 32px;
    width: 2px;
    background: var(--margin);
    opacity: 0.55;
  }

  ol.task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.task {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 36px;
    line-height: 36px;
    cursor: pointer;
  }
  .row-lead {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .row-mark {
    width: 20px;
    height: 18px;
    flex-shrink: 0;
    color: var(--ink);
    display: flex;
    align-items: center;
  }
  .row-mark svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  li.task.done { cursor: pointer; }
  li.task.done .task-text {
    color: var(--ink-muted);
  }
  li.task.done .row-mark { opacity: 0.5; }
  .urgent-toggle {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .urgent-toggle svg { width: 100%; height: 100%; display: block; }
  .urgent-toggle.urgent { transform: scale(1.35); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 16px;
  }
  .task-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--ink-muted);
    opacity: 0.55;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .task-actions button:hover { opacity: 1; color: var(--danger); }

  .add-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 36px;
    line-height: 36px;
  }
  .add-row .row-mark { opacity: 0.4; }
  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font: inherit;
    color: var(--ink);
    outline: none;
    padding: 0;
    line-height: 16px;
  }
  .add-row input[type="text"]::placeholder { color: var(--ink-muted); }
  .add-row button.add-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }

  .empty-state {
    color: var(--ink-muted);
    padding: 4px 0 16px;
    font-size: 0.88rem;
  }

  @media (max-width: 420px) {
    .sheet-tab { max-width: 100px; }
    .notebook-date { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="notebook">
    <div class="notebook-head">
      <span class="notebook-date" id="dateLabel"></span>
      <div class="head-right">
        <span class="notebook-progress" id="progressText"></span>
        <button class="menu-btn" id="menuBtn" title="תפריט" aria-haspopup="true" aria-expanded="false">&#9776;</button>
        <div class="menu-panel" id="menuPanel" hidden>
          <div class="menu-section">
            <div class="menu-label">תצוגה</div>
            <div class="filters">
              <button data-filter="all" class="active">הכל</button>
              <button data-filter="active">פעילות</button>
              <button data-filter="done">הושלמו</button>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-label">הפרויקט הנוכחי</div>
            <button id="renameSheetBtn">שינוי שם</button>
            <button id="deleteSheetBtn" class="danger">מחיקת פרויקט</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sheets-row">
      <div class="sheets-bar" id="sheetsBar"></div>
    </div>

    <div class="ruled-body">
      <ol class="task-list" id="taskList"></ol>
      <div class="empty-state" id="emptyState" style="display:none;">אין שורות בפרויקט הזה עדיין</div>
      <form class="add-row" id="addForm">
        <span class="row-mark" aria-hidden="true"><svg viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg"><path d="M16 3 L4 15 M1.5 3 L6.5 3 M13.5 3 L18.5 3 M1.5 15 L6.5 15 M13.5 15 L18.5 15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span>
        <input type="text" id="taskInput" placeholder="כתבו כאן שורה חדשה..." maxlength="200" required autocomplete="off">
        <button type="submit" class="add-btn" title="הוספה">+</button>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "daily-tasks-sheets-v1";
  var ROW_MARK_BASE_D = "M16 3 L4 15 M1.5 3 L6.5 3 M13.5 3 L18.5 3 M1.5 15 L6.5 15 M13.5 15 L18.5 15";
  var ROW_MARK_HALF_D = "M4 3 L10 9";
  var ROW_MARK_FULL_D = "M4 3 L16 15";

  function rowMarkSvg(status) {
    var progressD = status === 2 ? ROW_MARK_FULL_D : status === 1 ? ROW_MARK_HALF_D : "";
    var progressPath = progressD
      ? '<path d="' + progressD + '" fill="none" stroke="var(--danger)" stroke-width="2.1" stroke-linecap="round"/>'
      : "";
    return '<svg viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg"><path d="' + ROW_MARK_BASE_D + '" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>' + progressPath + '</svg>';
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultData() {
    var sheetId = uid();
    return {
      sheets: [{ id: sheetId, name: "פרויקט 1", tasks: [] }],
      activeSheetId: sheetId
    };
  }

  function loadData() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (parsed && Array.isArray(parsed.sheets) && parsed.sheets.length) {
        parsed.sheets.forEach(function (sheet) {
          (sheet.tasks || []).forEach(function (t) {
            if (typeof t.status !== "number") {
              t.status = t.done ? 2 : 0;
            }
            if (typeof t.urgent !== "boolean") {
              t.urgent = t.priority === "high";
            }
            delete t.done;
            delete t.priority;
          });
        });
        return parsed;
      }
    } catch (e) {}
    return defaultData();
  }
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  var data = loadData();
  var state = { filter: "all", renamingSheetId: null, menuOpen: false };

  var dateLabel = document.getElementById("dateLabel");
  var sheetsBar = document.getElementById("sheetsBar");
  var taskInput = document.getElementById("taskInput");
  var addForm = document.getElementById("addForm");
  var taskList = document.getElementById("taskList");
  var emptyState = document.getElementById("emptyState");
  var progressText = document.getElementById("progressText");
  var menuBtn = document.getElementById("menuBtn");
  var menuPanel = document.getElementById("menuPanel");
  var filterButtons = document.querySelectorAll(".filters button");
  var renameSheetBtn = document.getElementById("renameSheetBtn");
  var deleteSheetBtn = document.getElementById("deleteSheetBtn");

  function todayLabel() {
    var d = new Date();
    var day = String(d.getDate()).padStart(2, "0");
    var month = String(d.getMonth() + 1).padStart(2, "0");
    return day + "/" + month + "/" + d.getFullYear();
  }
  dateLabel.textContent = todayLabel();

  function activeSheet() {
    var sheet = data.sheets.find(function (s) { return s.id === data.activeSheetId; });
    return sheet || data.sheets[0];
  }

  function addSheet() {
    var name = "פרויקט " + (data.sheets.length + 1);
    var sheet = { id: uid(), name: name, tasks: [] };
    data.sheets.push(sheet);
    data.activeSheetId = sheet.id;
    state.renamingSheetId = sheet.id;
    saveData();
    render();
  }

  function selectSheet(id) {
    if (data.activeSheetId === id) return;
    data.activeSheetId = id;
    state.filter = "all";
    saveData();
    render();
  }

  function commitRename(id, value) {
    var sheet = data.sheets.find(function (s) { return s.id === id; });
    var trimmed = value.trim();
    if (sheet && trimmed) {
      sheet.name = trimmed.slice(0, 40);
    }
    state.renamingSheetId = null;
    saveData();
    render();
  }

  function deleteSheet(id) {
    if (data.sheets.length <= 1) {
      alert("חייב להישאר לפחות פרויקט אחד.");
      return;
    }
    var sheet = data.sheets.find(function (s) { return s.id === id; });
    var msg = sheet ? "למחוק את הפרויקט \"" + sheet.name + "\" ואת כל השורות שבו?" : "למחוק את הפרויקט?";
    if (!confirm(msg)) return;
    data.sheets = data.sheets.filter(function (s) { return s.id !== id; });
    if (data.activeSheetId === id) {
      data.activeSheetId = data.sheets[0].id;
    }
    saveData();
    render();
  }

  renameSheetBtn.addEventListener("click", function () {
    state.menuOpen = false;
    state.renamingSheetId = activeSheet().id;
    render();
  });
  deleteSheetBtn.addEventListener("click", function () {
    state.menuOpen = false;
    deleteSheet(activeSheet().id);
  });

  menuBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    state.menuOpen = !state.menuOpen;
    render();
  });
  document.addEventListener("click", function (e) {
    if (state.menuOpen && !menuPanel.contains(e.target) && e.target !== menuBtn) {
      state.menuOpen = false;
      render();
    }
  });

  function renderSheetsBar() {
    sheetsBar.innerHTML = "";
    data.sheets.forEach(function (sheet) {
      var tab = document.createElement("div");
      tab.className = "sheet-tab" + (sheet.id === data.activeSheetId ? " active" : "");

      if (state.renamingSheetId === sheet.id) {
        var input = document.createElement("input");
        input.className = "rename-input";
        input.value = sheet.name;
        input.maxLength = 40;
        input.addEventListener("click", function (e) { e.stopPropagation(); });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { commitRename(sheet.id, input.value); }
          if (e.key === "Escape") { state.renamingSheetId = null; render(); }
        });
        input.addEventListener("blur", function () { commitRename(sheet.id, input.value); });
        tab.appendChild(input);
        sheetsBar.appendChild(tab);
        input.focus();
        input.select();
        return;
      }

      tab.textContent = sheet.name;
      tab.title = sheet.id === data.activeSheetId ? "לחצו לשינוי שם" : sheet.name;
      tab.addEventListener("click", function () {
        if (sheet.id === data.activeSheetId) {
          state.renamingSheetId = sheet.id;
          render();
        } else {
          selectSheet(sheet.id);
        }
      });
      tab.addEventListener("dblclick", function (e) {
        e.stopPropagation();
        data.activeSheetId = sheet.id;
        state.renamingSheetId = sheet.id;
        render();
      });
      sheetsBar.appendChild(tab);
    });

    var addBtn = document.createElement("button");
    addBtn.className = "sheet-tab add-sheet-tab";
    addBtn.type = "button";
    addBtn.title = "הוספת פרויקט";
    addBtn.textContent = "+";
    addBtn.addEventListener("click", addSheet);
    sheetsBar.appendChild(addBtn);
  }

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = taskInput.value.trim();
    if (!text) return;
    activeSheet().tasks.push({
      id: uid(),
      text: text,
      status: 0,
      urgent: false,
      createdAt: Date.now()
    });
    saveData();
    taskInput.value = "";
    render();
    taskInput.focus();
  });

  filterButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filterButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.filter = btn.dataset.filter;
      render();
    });
  });

  function cycleStatus(id) {
    var t = activeSheet().tasks.find(function (x) { return x.id === id; });
    if (t) {
      t.status = (t.status + 1) % 3;
      saveData();
      render();
    }
  }

  function removeTask(id) {
    var sheet = activeSheet();
    sheet.tasks = sheet.tasks.filter(function (x) { return x.id !== id; });
    saveData();
    render();
  }

  function toggleUrgent(id) {
    var t = activeSheet().tasks.find(function (x) { return x.id === id; });
    if (t) {
      t.urgent = !t.urgent;
      saveData();
      render();
    }
  }

  var URGENT_CIRCLE_SVG = '<svg viewBox="0 0 11 11" xmlns="http://www.w3.org/2000/svg"><circle cx="5.5" cy="5.5" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
  var URGENT_MARK_SVG = '<svg viewBox="0 0 11 11" xmlns="http://www.w3.org/2000/svg"><line x1="5.5" y1="0.8" x2="5.5" y2="6.9" stroke="var(--danger)" stroke-width="2.6" stroke-linecap="round"/><circle cx="5.5" cy="9.4" r="1.5" fill="var(--danger)"/></svg>';

  function render() {
    renderSheetsBar();

    menuPanel.hidden = !state.menuOpen;
    menuBtn.setAttribute("aria-expanded", String(state.menuOpen));
    filterButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.filter === state.filter); });

    var STATUS_LABEL = { 0: "לחצו כדי לסמן טיפול חלקי", 1: "לחצו כדי לסמן כהושלם", 2: "לחצו כדי לאפס" };

    var sheetTasks = activeSheet().tasks;
    var sorted = sheetTasks.slice().sort(function (a, b) {
      if (a.status !== b.status) return a.status - b.status;
      return a.createdAt - b.createdAt;
    });

    var visible = sorted.filter(function (t) {
      if (state.filter === "active") return t.status !== 2;
      if (state.filter === "done") return t.status === 2;
      return true;
    });

    taskList.innerHTML = "";
    visible.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "task" + (t.status === 1 ? " partial" : "") + (t.status === 2 ? " done" : "");
      li.addEventListener("click", function () { cycleStatus(t.id); });

      var check = document.createElement("span");
      check.className = "row-mark";
      check.setAttribute("aria-hidden", "true");
      check.title = STATUS_LABEL[t.status];
      check.innerHTML = rowMarkSvg(t.status);

      var dot = document.createElement("span");
      dot.className = "urgent-toggle" + (t.urgent ? " urgent" : "");
      dot.title = t.urgent ? "לחצו לביטול הדחיפות" : "לחצו לסימון כדחוף";
      dot.innerHTML = t.urgent ? URGENT_MARK_SVG : URGENT_CIRCLE_SVG;
      dot.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleUrgent(t.id);
      });

      var textEl = document.createElement("span");
      textEl.className = "task-text";
      textEl.textContent = t.text;
      textEl.title = t.text;

      var actions = document.createElement("span");
      actions.className = "task-actions";
      var delBtn = document.createElement("button");
      delBtn.innerHTML = "&#10005;";
      delBtn.title = "מחיקה";
      delBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        removeTask(t.id);
      });
      actions.appendChild(delBtn);

      var lead = document.createElement("span");
      lead.className = "row-lead";
      lead.appendChild(dot);
      lead.appendChild(check);

      li.appendChild(lead);
      li.appendChild(textEl);
      li.appendChild(actions);
      taskList.appendChild(li);
    });

    emptyState.style.display = visible.length ? "none" : "block";

    var total = sheetTasks.length;
    var doneCount = sheetTasks.filter(function (t) { return t.status === 2; }).length;
    progressText.textContent = doneCount + "/" + total + " הושלמו";
  }

  render();
})();
</script>
</body>
</html>
