<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גיליונות משימות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5fb;
    --card: #ffffff;
    --text: #23263a;
    --muted: #6c7089;
    --border: #e2e4f0;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --danger: #ef4444;
    --success: #16a34a;
    --high: #ef4444;
    --medium: #f59e0b;
    --low: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151f;
      --card: #1d1f2c;
      --text: #e7e8f3;
      --muted: #9a9dbb;
      --border: #2e3044;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151f;
    --card: #1d1f2c;
    --text: #e7e8f3;
    --muted: #9a9dbb;
    --border: #2e3044;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Assistant", "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-family: "Rubik", "Assistant", "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.9rem;
  }

  .sheets-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 8px;
    margin-bottom: 12px;
  }
  .sheets-bar::-webkit-scrollbar { height: 6px; }
  .sheets-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .sheet-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .sheet-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
    font-weight: 600;
  }
  .sheet-tab .tab-name {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sheet-tab input.rename-input {
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 90px;
    outline: none;
    border-bottom: 1px solid currentColor;
  }
  .sheet-tab .tab-action {
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    font-size: 0.85rem;
    line-height: 1;
    padding: 2px;
    opacity: 0.8;
  }
  .sheet-tab .tab-action:hover { opacity: 1; }
  .add-sheet-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--primary);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .add-sheet-btn:hover { background: var(--card); }

  .progress {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--success);
    transition: width 0.25s ease;
  }
  form.add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .add-form .row {
    display: flex;
    gap: 8px;
  }
  .add-form input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--card);
    color: var(--text);
  }
  .add-form select {
    padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 0.9rem;
  }
  .add-form button.submit {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .add-form button.submit:hover { background: var(--primary-dark); }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .filters button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .filters button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  ul.task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  li.task.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    padding: 0;
  }
  li.task.done .checkbox {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .priority-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .priority-high { background: var(--high); }
  .priority-medium { background: var(--medium); }
  .priority-low { background: var(--low); }

  .task-body {
    flex: 1;
    min-width: 0;
  }
  .task-text {
    font-size: 0.95rem;
    word-break: break-word;
  }
  .task-meta {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .task-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: var(--muted);
    padding: 4px;
  }
  .task-actions button:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 0.9rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .add-form select { background: var(--card); color: var(--text); }
  }
  :root[data-theme="dark"] .add-form select { background: var(--card); color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>גיליונות משימות</h1>
    <p>צרו גיליון לכל נושא או יום, תנו לו שם, ונהלו את השורות שבתוכו</p>
  </header>

  <div class="sheets-bar" id="sheetsBar"></div>

  <div class="progress">
    <div class="progress-top">
      <span id="progressText">0 מתוך 0 הושלמו</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
  </div>

  <form class="add-form" id="addForm">
    <div class="row">
      <input type="text" id="taskInput" placeholder="הוסף שורה חדשה..." maxlength="200" required autocomplete="off">
      <select id="prioritySelect" title="עדיפות">
        <option value="medium">בינונית</option>
        <option value="high">גבוהה</option>
        <option value="low">נמוכה</option>
      </select>
    </div>
    <button type="submit" class="submit">הוספת שורה</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">הכל</button>
    <button data-filter="active">פעילות</button>
    <button data-filter="done">הושלמו</button>
  </div>

  <ul class="task-list" id="taskList"></ul>
  <div class="empty-state" id="emptyState" style="display:none;">אין שורות בגיליון הזה עדיין</div>
</div>

<script>
(function () {
  var STORAGE_KEY = "daily-tasks-sheets-v1";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultData() {
    var sheetId = uid();
    return {
      sheets: [{ id: sheetId, name: "גיליון 1", tasks: [] }],
      activeSheetId: sheetId
    };
  }

  function loadData() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (parsed && Array.isArray(parsed.sheets) && parsed.sheets.length) {
        return parsed;
      }
    } catch (e) {}
    return defaultData();
  }
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  var data = loadData();
  var state = { filter: "all", renamingSheetId: null };

  var sheetsBar = document.getElementById("sheetsBar");
  var taskInput = document.getElementById("taskInput");
  var prioritySelect = document.getElementById("prioritySelect");
  var addForm = document.getElementById("addForm");
  var taskList = document.getElementById("taskList");
  var emptyState = document.getElementById("emptyState");
  var progressText = document.getElementById("progressText");
  var progressPercent = document.getElementById("progressPercent");
  var progressFill = document.getElementById("progressFill");
  var filterButtons = document.querySelectorAll(".filters button");

  function activeSheet() {
    var sheet = data.sheets.find(function (s) { return s.id === data.activeSheetId; });
    return sheet || data.sheets[0];
  }

  function addSheet() {
    var name = "גיליון " + (data.sheets.length + 1);
    var sheet = { id: uid(), name: name, tasks: [] };
    data.sheets.push(sheet);
    data.activeSheetId = sheet.id;
    state.renamingSheetId = sheet.id;
    saveData();
    render();
  }

  function selectSheet(id) {
    if (data.activeSheetId === id) return;
    data.activeSheetId = id;
    state.filter = "all";
    filterButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.filter === "all"); });
    saveData();
    render();
  }

  function startRename(id) {
    state.renamingSheetId = id;
    render();
  }

  function commitRename(id, value) {
    var sheet = data.sheets.find(function (s) { return s.id === id; });
    var trimmed = value.trim();
    if (sheet && trimmed) {
      sheet.name = trimmed.slice(0, 40);
    }
    state.renamingSheetId = null;
    saveData();
    render();
  }

  function deleteSheet(id) {
    if (data.sheets.length <= 1) {
      alert("חייב להישאר לפחות גיליון אחד.");
      return;
    }
    var sheet = data.sheets.find(function (s) { return s.id === id; });
    var msg = sheet ? "למחוק את הגיליון \"" + sheet.name + "\" ואת כל השורות שבו?" : "למחוק את הגיליון?";
    if (!confirm(msg)) return;
    data.sheets = data.sheets.filter(function (s) { return s.id !== id; });
    if (data.activeSheetId === id) {
      data.activeSheetId = data.sheets[0].id;
    }
    saveData();
    render();
  }

  function renderSheetsBar() {
    sheetsBar.innerHTML = "";
    data.sheets.forEach(function (sheet) {
      var tab = document.createElement("div");
      tab.className = "sheet-tab" + (sheet.id === data.activeSheetId ? " active" : "");

      if (state.renamingSheetId === sheet.id) {
        var input = document.createElement("input");
        input.className = "rename-input";
        input.value = sheet.name;
        input.maxLength = 40;
        input.addEventListener("click", function (e) { e.stopPropagation(); });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { commitRename(sheet.id, input.value); }
          if (e.key === "Escape") { state.renamingSheetId = null; render(); }
        });
        input.addEventListener("blur", function () { commitRename(sheet.id, input.value); });
        tab.appendChild(input);
        sheetsBar.appendChild(tab);
        input.focus();
        input.select();
        return;
      }

      tab.addEventListener("click", function () { selectSheet(sheet.id); });

      var nameEl = document.createElement("span");
      nameEl.className = "tab-name";
      nameEl.textContent = sheet.name;
      tab.appendChild(nameEl);

      if (sheet.id === data.activeSheetId) {
        var renameBtn = document.createElement("button");
        renameBtn.className = "tab-action";
        renameBtn.innerHTML = "✎";
        renameBtn.title = "שינוי שם הגיליון";
        renameBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          startRename(sheet.id);
        });
        tab.appendChild(renameBtn);

        var delBtn = document.createElement("button");
        delBtn.className = "tab-action";
        delBtn.innerHTML = "✕";
        delBtn.title = "מחיקת הגיליון";
        delBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          deleteSheet(sheet.id);
        });
        tab.appendChild(delBtn);
      }

      sheetsBar.appendChild(tab);
    });

    var addBtn = document.createElement("button");
    addBtn.className = "add-sheet-btn";
    addBtn.innerHTML = "+ גיליון חדש";
    addBtn.addEventListener("click", addSheet);
    sheetsBar.appendChild(addBtn);
  }

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = taskInput.value.trim();
    if (!text) return;
    activeSheet().tasks.push({
      id: uid(),
      text: text,
      done: false,
      priority: prioritySelect.value,
      createdAt: Date.now()
    });
    saveData();
    taskInput.value = "";
    render();
    taskInput.focus();
  });

  filterButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filterButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.filter = btn.dataset.filter;
      render();
    });
  });

  function toggleDone(id) {
    var t = activeSheet().tasks.find(function (x) { return x.id === id; });
    if (t) {
      t.done = !t.done;
      saveData();
      render();
    }
  }

  function removeTask(id) {
    var sheet = activeSheet();
    sheet.tasks = sheet.tasks.filter(function (x) { return x.id !== id; });
    saveData();
    render();
  }

  var PRIORITY_LABEL = { high: "גבוהה", medium: "בינונית", low: "נמוכה" };

  function render() {
    renderSheetsBar();

    var sheetTasks = activeSheet().tasks;
    var sorted = sheetTasks.slice().sort(function (a, b) {
      var order = { high: 0, medium: 1, low: 2 };
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (order[a.priority] !== order[b.priority]) return order[a.priority] - order[b.priority];
      return a.createdAt - b.createdAt;
    });

    var visible = sorted.filter(function (t) {
      if (state.filter === "active") return !t.done;
      if (state.filter === "done") return t.done;
      return true;
    });

    taskList.innerHTML = "";
    visible.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "task" + (t.done ? " done" : "");

      var checkBtn = document.createElement("button");
      checkBtn.className = "checkbox";
      checkBtn.innerHTML = t.done ? "✓" : "";
      checkBtn.title = t.done ? "סמן כלא הושלם" : "סמן כהושלם";
      checkBtn.addEventListener("click", function () { toggleDone(t.id); });

      var dot = document.createElement("span");
      dot.className = "priority-dot priority-" + t.priority;
      dot.title = "עדיפות " + PRIORITY_LABEL[t.priority];

      var body = document.createElement("div");
      body.className = "task-body";
      var textEl = document.createElement("div");
      textEl.className = "task-text";
      textEl.textContent = t.text;
      var metaEl = document.createElement("div");
      metaEl.className = "task-meta";
      metaEl.textContent = "עדיפות " + PRIORITY_LABEL[t.priority];
      body.appendChild(textEl);
      body.appendChild(metaEl);

      var actions = document.createElement("div");
      actions.className = "task-actions";
      var delBtn = document.createElement("button");
      delBtn.innerHTML = "🗑";
      delBtn.title = "מחיקה";
      delBtn.addEventListener("click", function () { removeTask(t.id); });
      actions.appendChild(delBtn);

      li.appendChild(checkBtn);
      li.appendChild(dot);
      li.appendChild(body);
      li.appendChild(actions);
      taskList.appendChild(li);
    });

    emptyState.style.display = visible.length ? "none" : "block";

    var total = sheetTasks.length;
    var doneCount = sheetTasks.filter(function (t) { return t.done; }).length;
    var pct = total ? Math.round((doneCount / total) * 100) : 0;
    progressText.textContent = doneCount + " מתוך " + total + " הושלמו";
    progressPercent.textContent = pct + "%";
    progressFill.style.width = pct + "%";
  }

  render();
})();
</script>
</body>
</html>
