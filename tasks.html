<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פרויקטי משימות</title>
<link rel="manifest" href="tasks-manifest.json">
<meta name="theme-color" content="#35618f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="משימות">
<link rel="apple-touch-icon" href="tasks-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --desk: #e7e2d3;
    --paper: #fbf7ee;
    --paper-alt: #eee6d2;
    --rule: #c2d9ec;
    --margin: #d98a90;
    --ink: #2c2a24;
    --ink-muted: #918a78;
    --accent: #35618f;
    --accent-contrast: #fdfbf5;
    --danger: #b6473f;
    --high: #c0392b;
    --medium: #b8811f;
    --low: #3c8a5c;
    --shadow: rgba(44, 42, 36, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #101114;
      --paper: #242219;
      --paper-alt: #2c2a20;
      --rule: #3a4652;
      --margin: #8a4b50;
      --ink: #ece5d6;
      --ink-muted: #a49a85;
      --accent: #7fb0e0;
      --accent-contrast: #16181c;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --desk: #101114;
    --paper: #242219;
    --paper-alt: #2c2a20;
    --rule: #3a4652;
    --margin: #8a4b50;
    --ink: #ece5d6;
    --ink-muted: #a49a85;
    --accent: #7fb0e0;
    --accent-contrast: #16181c;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Assistant", "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--desk);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .app {
    max-width: 620px;
    margin: 0 auto;
  }

  .notebook {
    background: var(--paper);
    border-radius: 10px;
    box-shadow: 0 18px 40px var(--shadow);
  }

  .notebook-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 10px;
  }
  .notebook-date-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-click-area {
    position: relative;
    display: inline-flex;
    border-radius: 6px;
  }
  .date-click-area:hover { background: var(--paper-alt); }
  .notebook-date {
    font-family: "Rubik", "Assistant", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    padding: 2px 4px;
    pointer-events: none;
  }
  .date-input-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .today-btn {
    font-size: 0.72rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    color: var(--accent);
    background: none;
    padding: 3px 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .notebook-progress {
    font-size: 0.8rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .sheets-search {
    position: relative;
    flex-shrink: 0;
    margin-bottom: 1px;
  }
  .menu-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--ink);
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-btn:hover { background: var(--paper-alt); }

  .menu-panel {
    position: absolute;
    top: 42px;
    left: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: 0 10px 26px var(--shadow);
    padding: 10px;
    width: 200px;
    z-index: 5;
  }
  .menu-panel[hidden] { display: none; }

  .search-panel {
    position: absolute;
    top: 40px;
    left: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: 0 10px 26px var(--shadow);
    padding: 10px;
    width: 260px;
    max-width: calc(100vw - 40px);
    z-index: 6;
  }
  .search-panel[hidden] { display: none; }
  .search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--paper-alt);
    color: var(--ink);
    font: inherit;
    font-size: 0.88rem;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-results {
    margin-top: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .search-empty {
    color: var(--ink-muted);
    font-size: 0.82rem;
    padding: 8px 2px;
  }
  .search-result {
    display: block;
    width: 100%;
    text-align: right;
    background: none;
    border: none;
    border-radius: 6px;
    padding: 7px 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .search-result:hover { background: var(--paper-alt); }
  .search-result-text {
    display: block;
    color: var(--ink);
    font-size: 0.88rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-result-meta {
    display: block;
    color: var(--ink-muted);
    font-size: 0.72rem;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .menu-section + .menu-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .menu-label {
    font-size: 0.72rem;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .menu-panel .filters { display: flex; flex-direction: column; gap: 4px; }
  .menu-panel button {
    width: 100%;
    text-align: right;
    padding: 7px 10px;
    border-radius: 6px;
    border: none;
    background: none;
    color: var(--ink);
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
  }
  .menu-panel button:hover { background: var(--paper-alt); }
  .menu-panel button.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .menu-panel button.danger { color: var(--danger); }

  .sheets-row {
    background: var(--paper-alt);
    padding: 8px 10px 0;
    display: flex;
    align-items: flex-end;
    gap: 6px;
  }
  .sheets-bar {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  .sheets-bar::-webkit-scrollbar { display: none; }
  .sheet-tab {
    flex-shrink: 0;
    padding: 7px 16px 7px 22px;
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.83rem;
    cursor: pointer;
    white-space: nowrap;
    max-width: 130px;
    overflow: hidden;
    border: 1px solid transparent;
    border-radius: 5px 5px 0 0;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%);
    position: relative;
  }
  .sheet-tab-label {
    display: inline-block;
    white-space: nowrap;
  }
  .sheet-tab-marquee-track {
    display: inline-flex;
    gap: 24px;
    animation-name: sheet-tab-marquee;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes sheet-tab-marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(var(--marquee-segment, 0)); }
  }
  .sheet-tab:not(:first-child) {
    margin-right: -10px;
  }
  .move-task-mode {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .move-task-mode button {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: var(--paper-alt);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .move-task-mode button.active {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: var(--accent);
  }
  .move-task-projects {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .move-task-projects button {
    width: 100%;
    text-align: right;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--paper-alt);
    color: var(--ink);
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .move-task-projects button:hover { background: var(--rule); }
  .move-task-empty {
    color: var(--ink-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 10px 0;
  }
  .sheet-tab:hover:not(.active) {
    background: rgba(0, 0, 0, 0.05);
    color: var(--ink);
    z-index: 1;
  }
  .sheet-tab.active {
    background: var(--paper);
    color: var(--ink);
    font-weight: 700;
    border-color: var(--rule);
    z-index: 2;
  }
  .sheet-tab input.rename-input {
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 80px;
    outline: none;
    border-bottom: 1px solid currentColor;
  }
  .add-sheet-tab {
    color: var(--accent);
    font-weight: 700;
    font-family: inherit;
  }
  .add-sheet-tab:hover {
    color: var(--accent);
  }

  .ruled-body {
    position: relative;
    background-image: repeating-linear-gradient(
      var(--paper) 0,
      var(--paper) 35px,
      var(--rule) 35px,
      var(--rule) 36px
    );
    background-origin: content-box;
    background-clip: content-box;
    border-radius: 0 0 10px 10px;
    padding: 20px 22px 4px 44px;
  }
  .ruled-body::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    right: 39px;
    width: 2px;
    background: var(--margin);
    opacity: 0.55;
  }

  ol.task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.task {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 36px;
    line-height: 36px;
    cursor: pointer;
  }
  .row-lead {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .row-mark {
    width: 20px;
    height: 18px;
    flex-shrink: 0;
    color: var(--ink);
    display: flex;
    align-items: center;
  }
  .row-mark svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  li.task.done { cursor: pointer; }
  li.task.done .task-text {
    color: var(--ink-muted);
  }
  li.task.done .row-mark { opacity: 0.5; }
  .urgent-toggle {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .urgent-toggle svg { width: 100%; height: 100%; display: block; }
  .urgent-toggle.urgent {
    transform: scale(1.35);
    border-radius: 50%;
    background: var(--danger);
    animation: urgent-blink 1.1s ease-in-out infinite;
  }
  @keyframes urgent-blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(182, 71, 63, 0.7); }
    50% { opacity: 0.45; box-shadow: 0 0 6px 2px rgba(182, 71, 63, 0.9); }
  }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 16px;
  }
  .task-text-input {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1px solid var(--accent);
    background: transparent;
    font: inherit;
    color: var(--ink);
    outline: none;
    padding: 0;
    line-height: 16px;
  }
  .task-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--ink-muted);
    opacity: 0.55;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .task-actions button:hover { opacity: 1; color: var(--danger); }
  .row-date {
    flex-shrink: 0;
    font-size: 0.72rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .add-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 36px;
    line-height: 36px;
  }
  .add-row[hidden] { display: none; }
  li.task.readonly { cursor: default; }
  .add-row .row-mark { opacity: 0.4; }
  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font: inherit;
    color: var(--ink);
    outline: none;
    padding: 0;
    line-height: 16px;
  }
  .add-row input[type="text"]::placeholder { color: var(--ink-muted); }
  .add-row button.add-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }

  .empty-state {
    color: var(--ink-muted);
    padding: 4px 0 16px;
    font-size: 0.88rem;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 14, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 20px 50px var(--shadow);
    padding: 20px;
    width: 100%;
    max-width: 320px;
  }
  .modal-message {
    margin: 0 0 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--ink);
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-btn-yes {
    border: none;
    background: var(--danger);
    color: var(--accent-contrast);
  }
  .modal-btn-no {
    border: 1px solid var(--rule);
    background: var(--paper-alt);
    color: var(--ink);
  }

  .install-fab {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px var(--shadow);
    z-index: 15;
  }
  .install-fab[hidden] { display: none; }
  .install-fab:hover { background: var(--accent); opacity: 0.9; }

  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: linear-gradient(160deg, #3f6d9c 0%, #2c4f78 100%);
    transition: opacity 0.5s ease;
  }
  .splash-screen.splash-hide {
    opacity: 0;
    pointer-events: none;
  }
  .splash-screen[hidden] { display: none; }
  .splash-logo {
    width: 120px;
    height: 120px;
    border-radius: 26px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
    animation: splash-pop 0.5s ease;
  }
  .splash-app-name {
    font-family: "Rubik", "Assistant", sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fbf7ee;
    animation: splash-pop 0.5s ease;
  }
  @keyframes splash-pop {
    from { transform: scale(0.75); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .auth-gate {
    position: fixed;
    inset: 0;
    background: var(--desk);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 30;
  }
  .auth-gate[hidden] { display: none; }
  .auth-box {
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 20px 50px var(--shadow);
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
  }
  .auth-title {
    font-family: "Rubik", "Assistant", sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 4px;
    text-align: center;
    color: var(--ink);
  }
  .auth-subtitle {
    text-align: center;
    color: var(--ink-muted);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .auth-input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--paper-alt);
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    outline: none;
  }
  .auth-input:focus { border-color: var(--accent); }
  .auth-error {
    color: var(--danger);
    font-size: 0.83rem;
    margin: 0 0 10px;
    text-align: center;
  }
  .auth-error[hidden] { display: none; }
  .auth-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .auth-btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    font-size: 0.92rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-btn-primary {
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .auth-btn-secondary {
    border: 1px solid var(--rule);
    background: var(--paper-alt);
    color: var(--ink);
  }
  .auth-btn[disabled] { opacity: 0.6; cursor: default; }

  @media (max-width: 420px) {
    .sheet-tab { max-width: 100px; }
    .notebook-date { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div class="splash-screen" id="splashScreen">
  <img src="tasks-icon-512.png" class="splash-logo" alt="פרויקטי משימות">
  <div class="splash-app-name">פרויקטי משימות</div>
</div>

<div class="auth-gate" id="authGate">
  <div class="auth-box">
    <h1 class="auth-title">פרויקטי משימות</h1>
    <p class="auth-subtitle">התחברו כדי לראות את המשימות שלכם</p>
    <form id="authForm">
      <input type="text" id="authUsername" class="auth-input" placeholder="שם משתמש" autocomplete="username" required>
      <input type="password" id="authPassword" class="auth-input" placeholder="סיסמה" autocomplete="current-password" required minlength="6">
      <p class="auth-error" id="authError" hidden></p>
      <div class="auth-actions">
        <button type="submit" class="auth-btn auth-btn-primary" id="authLoginBtn">התחברות</button>
        <button type="button" class="auth-btn auth-btn-secondary" id="authSignupBtn">הרשמה</button>
      </div>
    </form>
  </div>
</div>

<div class="app" id="appRoot" hidden>
  <div class="notebook">
    <div class="notebook-head">
      <span class="notebook-date-wrap">
        <span class="date-click-area">
          <span class="notebook-date" id="dateLabel"></span>
          <input type="date" id="dateInput" class="date-input-overlay" title="לחצו לבחירת תאריך">
        </span>
        <button type="button" class="today-btn" id="todayBtn" hidden>היום</button>
      </span>
      <div class="head-right">
        <span class="notebook-progress" id="progressText"></span>
        <button class="menu-btn" id="menuBtn" title="תפריט" aria-haspopup="true" aria-expanded="false">&#9776;</button>
        <div class="menu-panel" id="menuPanel" hidden>
          <div class="menu-section">
            <div class="menu-label">תצוגה</div>
            <div class="filters">
              <button data-filter="all" class="active">הכל</button>
              <button data-filter="active">פעילות</button>
              <button data-filter="done">הושלמו</button>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-label">הפרויקט הנוכחי</div>
            <button id="renameSheetBtn">שינוי שם</button>

        <input type="text" id="taskInput" placeholder="כתבו כאן שורה חדשה..." maxlength="200" required autocomplete="off">

  <div class="modal-overlay" id="moveTaskOverlay" hidden>

        <button type="button" class="active" id="moveModeMoveBtn">העברה</button>
        <button type="button" id="moveModeCopyBtn">העתקה</button>

      <div class="move-task-projects" id="moveTaskProjects"></div>

        <button type="button" class="modal-btn modal-btn-no" id="moveTaskCancelBtn">ביטול</button>

  <div class="modal-overlay" id="changeUsernameOverlay" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true">

      <input type="text" id="newUsernameInput" class="auth-input" placeholder="שם משתמש חדש" autocomplete="username">
      <p class="auth-error" id="changeUsernameError" hidden></p>

        <button type="button" class="modal-btn modal-btn-yes" id="changeUsernameSaveBtn">שמירה</button>

        <button type="button" class="modal-btn modal-btn-yes" id="iosInstallCloseBtn">הבנתי</button>
      </div>

</div>

<script>
(function () {
  var splashScreen = document.getElementById("splashScreen");
  if (splashScreen) {
    setTimeout(function () {
      splashScreen.classList.add("splash-hide");
      setTimeout(function () { splashScreen.hidden = true; }, 500);
    }, 3000);
  }

  var STORAGE_KEY = "daily-tasks-sheets-v1";
  function localStorageKey() {
    return SUPABASE_ROW_ID ? (STORAGE_KEY + ":" + SUPABASE_ROW_ID) : STORAGE_KEY;
  }
  var ROW_MARK_BASE_D = "M4 3 L16 15 M1.5 3 L6.5 3 M13.5 3 L18.5 3 M1.5 15 L6.5 15 M13.5 15 L18.5 15";
  var ROW_MARK_HALF_D = "M16 3 L10 9";
  var ROW_MARK_FULL_D = "M16 3 L4 15";

  function rowMarkSvg(status) {
    var progressD = status === 2 ? ROW_MARK_FULL_D : status === 1 ? ROW_MARK_HALF_D : "";
    var progressPath = progressD
      ? '<path d="' + progressD + '" fill="none" stroke="var(--danger)" stroke-width="2.1" stroke-linecap="round"/>'
      : "";
    return '<svg viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg"><path d="' + ROW_MARK_BASE_D + '" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>' + progressPath + '</svg>';
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function todayISO() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function addDaysToISO(iso, delta) {
    var parts = iso.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    d.setDate(d.getDate() + delta);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function isoToDisplay(iso) {
    var parts = iso.split("-");
    return parts[2] + "/" + parts[1];
  }

  function applyDailyRollover(data) {
    var today = todayISO();
    if (data.lastRolloverDate === today) return false;
    data.sheets.forEach(function (sheet) {
      (sheet.tasks || []).forEach(function (t) {
        if (typeof t.date !== "string") t.date = today;
        if (t.status !== 2 && t.date < today) t.date = today;
      });
    });
    data.lastRolloverDate = today;
    return true;
  }

  function defaultData() {
    var sheetId = uid();
    return {
      sheets: [{ id: sheetId, name: "פרויקט 1", tasks: [] }],
      activeSheetId: sheetId
    };
  }

  function normalizeData(parsed) {
    if (!parsed || !Array.isArray(parsed.sheets) || !parsed.sheets.length) return null;
    parsed.sheets.forEach(function (sheet) {
      (sheet.tasks || []).forEach(function (t) {
        if (typeof t.status !== "number") {
          t.status = t.done ? 2 : 0;
        }
        if (typeof t.urgent !== "boolean") {
          t.urgent = t.priority === "high";
        }
        delete t.done;
        delete t.priority;
      });
    });
    return parsed;
  }
  function loadLocalData() {
    try {
      return normalizeData(JSON.parse(localStorage.getItem(localStorageKey())));
    } catch (e) {
      return null;
    }
  }
  function saveLocalData() {
    try {
      localStorage.setItem(localStorageKey(), JSON.stringify(data));
    } catch (e) {}
  }

  var SUPABASE_URL = "https://oqvqrqhtywcqdnftaovk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_K6dRlzpWSRV7O-Dy_C8ypA_Yep2P3x7";
  var FAKE_EMAIL_DOMAIN = "users.itask-app.local";
  var SUPABASE_ROW_ID = null;
  var supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_KEY)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  function usernameToEmail(username) {
    var clean = username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, "");
    return clean + "@" + FAKE_EMAIL_DOMAIN;
  }

  function saveData() {
    saveLocalData();
    if (supabaseClient) {
      supabaseClient.from("app_state")
        .upsert({ id: SUPABASE_ROW_ID, data: data, updated_at: new Date().toISOString() })
        .then(function () {}, function () {});
    }
  }

  var data = defaultData();
  var state = { filter: "all", renamingSheetId: null, menuOpen: false, editingTaskId: null, viewDate: todayISO(), searchOpen: false };

  var dateLabel = document.getElementById("dateLabel");
  var sheetsBar = document.getElementById("sheetsBar");
  var taskInput = document.getElementById("taskInput");
  var addForm = document.getElementById("addForm");
  var taskList = document.getElementById("taskList");
  var emptyState = document.getElementById("emptyState");
  var progressText = document.getElementById("progressText");
  var menuBtn = document.getElementById("menuBtn");
  var menuPanel = document.getElementById("menuPanel");
  var searchBtn = document.getElementById("searchBtn");
  var searchPanel = document.getElementById("searchPanel");
  var searchInput = document.getElementById("searchInput");
  var searchResults = document.getElementById("searchResults");
  var filterButtons = document.querySelectorAll(".filters button");
  var renameSheetBtn = document.getElementById("renameSheetBtn");
  var deleteSheetBtn = document.getElementById("deleteSheetBtn");
  var confirmOverlay = document.getElementById("confirmOverlay");
  var confirmMessage = document.getElementById("confirmMessage");
  var confirmYesBtn = document.getElementById("confirmYesBtn");
  var confirmNoBtn = document.getElementById("confirmNoBtn");
  var pendingConfirmYes = null;

  function askConfirm(message, onYes) {
    confirmMessage.textContent = message;
    pendingConfirmYes = onYes;
    confirmOverlay.hidden = false;
  }
  function closeConfirm() {
    confirmOverlay.hidden = true;
    pendingConfirmYes = null;
  }
  confirmYesBtn.addEventListener("click", function () {
    var action = pendingConfirmYes;
    closeConfirm();
    if (action) action();
  });
  confirmNoBtn.addEventListener("click", closeConfirm);
  confirmOverlay.addEventListener("click", function (e) {
    if (e.target === confirmOverlay) closeConfirm();
  });

  var moveTaskOverlay = document.getElementById("moveTaskOverlay");
  var moveTaskProjects = document.getElementById("moveTaskProjects");
  var moveModeMoveBtn = document.getElementById("moveModeMoveBtn");
  var moveModeCopyBtn = document.getElementById("moveModeCopyBtn");
  var moveTaskCancelBtn = document.getElementById("moveTaskCancelBtn");
  var pendingMoveTaskId = null;
  var moveTaskMode = "move";

  function moveOrCopyTask(taskId, targetSheetId, mode) {
    var sourceSheet = activeSheet();
    var idx = sourceSheet.tasks.findIndex(function (x) { return x.id === taskId; });
    if (idx === -1) return;
    var task = sourceSheet.tasks[idx];
    var targetSheet = data.sheets.find(function (s) { return s.id === targetSheetId; });
    if (!targetSheet) return;

    if (mode === "copy") {
      targetSheet.tasks.push({
        id: uid(),
        text: task.text,
        status: task.status,
        urgent: task.urgent,
        date: task.date,
        createdAt: Date.now()
      });
    } else {
      sourceSheet.tasks.splice(idx, 1);
      targetSheet.tasks.push(task);
    }
    saveData();
    render();
  }

  function renderMoveTaskProjects() {
    moveTaskProjects.innerHTML = "";
    var others = data.sheets.filter(function (s) { return s.id !== data.activeSheetId; });
    if (!others.length) {
      var empty = document.createElement("div");
      empty.className = "move-task-empty";
      empty.textContent = "אין פרויקטים אחרים";
      moveTaskProjects.appendChild(empty);
      return;
    }
    others.forEach(function (s) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = s.name;
      btn.addEventListener("click", function () {
        moveOrCopyTask(pendingMoveTaskId, s.id, moveTaskMode);
        closeMoveTask();
      });
      moveTaskProjects.appendChild(btn);
    });
  }

  function openMoveTaskModal(taskId) {
    pendingMoveTaskId = taskId;
    moveTaskMode = "move";
    moveModeMoveBtn.classList.add("active");
    moveModeCopyBtn.classList.remove("active");
    renderMoveTaskProjects();
    moveTaskOverlay.hidden = false;
  }
  function closeMoveTask() {
    moveTaskOverlay.hidden = true;
    pendingMoveTaskId = null;
  }
  moveModeMoveBtn.addEventListener("click", function () {
    moveTaskMode = "move";
    moveModeMoveBtn.classList.add("active");
    moveModeCopyBtn.classList.remove("active");
  });
  moveModeCopyBtn.addEventListener("click", function () {
    moveTaskMode = "copy";
    moveModeCopyBtn.classList.add("active");
    moveModeMoveBtn.classList.remove("active");
  });
  moveTaskCancelBtn.addEventListener("click", closeMoveTask);
  moveTaskOverlay.addEventListener("click", function (e) {
    if (e.target === moveTaskOverlay) closeMoveTask();
  });

  (function setupInstallPrompt() {
    var installBtn = document.getElementById("installBtn");
    var instructionsOverlay = document.getElementById("iosInstallOverlay");
    var instructionsCloseBtn = document.getElementById("iosInstallCloseBtn");
    var instructionsText = document.getElementById("installInstructions");
    var deferredPrompt = null;

    var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    if (isStandalone) return;

    var ua = navigator.userAgent;
    var isIOS = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
    var isAndroid = /android/i.test(ua);

    var INSTRUCTIONS_IOS =
      "כדי להתקין את האפליקציה באייפון:<br><br>" +
      "1. הקש על כפתור השיתוף בסרגל הדפדפן (בדרך כלל למטה, ריבוע עם חץ)<br>" +
      "2. גלול ובחר ב-טופסים על \"הוסף למסך הבית\" (Add to Home Screen)<br>" +
      "3. הקש \"הוסף\" למעלה";
    var INSTRUCTIONS_ANDROID =
      "כדי להתקין את האפליקציה:<br><br>" +
      "1. הקש על תפריט שלוש הנקודות (⋮) למעלה בדפדפן<br>" +
      "2. בחר \"הוספה למסך הבית\" או \"התקן אפליקציה\"<br>" +
      "3. אשר את ההתקנה";
    var INSTRUCTIONS_DESKTOP =
      "כדי להתקין את האפליקציה:<br><br>" +
      "1. חפש סמל התקנה (⊕ או מחשב עם חץ) בצד ימין של שורת הכתובת<br>" +
      "2. אם אינך רואה אותו — פתח את תפריט שלוש הנקודות (⋮) ובחר \"התקן אפליקציה\"";

    function fallbackInstructions() {
      if (isIOS) return INSTRUCTIONS_IOS;
      if (isAndroid) return INSTRUCTIONS_ANDROID;
      return INSTRUCTIONS_DESKTOP;
    }

    installBtn.hidden = false;

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });

    window.addEventListener("appinstalled", function () {
      installBtn.hidden = true;
      deferredPrompt = null;
    });

    installBtn.addEventListener("click", function () {
      if (deferredPrompt) {
        installBtn.hidden = true;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
      } else {
        instructionsText.innerHTML = fallbackInstructions();
        instructionsOverlay.hidden = false;
      }
    });

    instructionsCloseBtn.addEventListener("click", function () { instructionsOverlay.hidden = true; });
    instructionsOverlay.addEventListener("click", function (e) {
      if (e.target === instructionsOverlay) instructionsOverlay.hidden = true;
    });
  })();

  function isoToFullDisplay(iso) {
    var parts = iso.split("-");
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }

  var dateInput = document.getElementById("dateInput");
  var todayBtn = document.getElementById("todayBtn");

  dateInput.addEventListener("change", function () {
    if (dateInput.value) {
      state.viewDate = dateInput.value;
      render();
    }
  });
  todayBtn.addEventListener("click", function () {
    state.viewDate = todayISO();
    render();
  });

  (function setupSwipeDateNav() {
    var notebookEl = document.querySelector(".notebook");
    if (!notebookEl) return;
    var startX = 0, startY = 0, startTime = 0, tracking = false;

    notebookEl.addEventListener("touchstart", function (e) {
      var target = e.target;
      if (state.menuOpen || state.searchOpen || e.touches.length !== 1 ||
          target.closest(".sheets-bar") || target.closest(".menu-panel") ||
          target.closest(".search-panel") || target.closest("input") || target.closest("textarea")) {
        tracking = false;
        return;
      }
      tracking = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startTime = Date.now();
    }, { passive: true });

    notebookEl.addEventListener("touchend", function (e) {
      if (!tracking) return;
      tracking = false;
      var touch = e.changedTouches[0];
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      var elapsed = Date.now() - startTime;
      if (elapsed < 800 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        state.viewDate = addDaysToISO(state.viewDate, dx < 0 ? -1 : 1);
        render();
      }
    }, { passive: true });
  })();

  (function setupSheetsBarResize() {
    var resizeTimer = null;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderSheetsBar, 200);
    });
  })();

  function activeSheet() {
    var sheet = data.sheets.find(function (s) { return s.id === data.activeSheetId; });
    return sheet || data.sheets[0];
  }

  function addSheet() {
    var name = "פרויקט " + (data.sheets.length + 1);
    var sheet = { id: uid(), name: name, tasks: [] };
    data.sheets.push(sheet);
    data.activeSheetId = sheet.id;
    state.renamingSheetId = sheet.id;
    saveData();
    render();
  }

  function selectSheet(id) {
    if (data.activeSheetId === id) return;
    data.activeSheetId = id;
    state.filter = "all";
    saveData();
    render();
  }

  function commitRename(id, value) {
    var sheet = data.sheets.find(function (s) { return s.id === id; });
    var trimmed = value.trim();
    if (sheet && trimmed) {
      sheet.name = trimmed.slice(0, 40);
    }
    state.renamingSheetId = null;
    saveData();
    render();
  }

  function deleteSheet(id) {
    if (data.sheets.length <= 1) {
      alert("חייב להישאר לפחות פרויקט אחד.");
      return;
    }
    var sheet = data.sheets.find(function (s) { return s.id === id; });
    var msg = sheet ? "למחוק את הפרויקט \"" + sheet.name + "\" ואת כל השורות שבו?" : "למחוק את הפרויקט?";
    askConfirm(msg, function () {
      data.sheets = data.sheets.filter(function (s) { return s.id !== id; });
      if (data.activeSheetId === id) {
        data.activeSheetId = data.sheets[0].id;
      }
      saveData();
      render();
    });
  }

  renameSheetBtn.addEventListener("click", function () {
    state.menuOpen = false;
    state.renamingSheetId = activeSheet().id;
    render();
  });
  deleteSheetBtn.addEventListener("click", function () {
    state.menuOpen = false;
    deleteSheet(activeSheet().id);
  });

  menuBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!state.menuOpen) closeSearch();
    state.menuOpen = !state.menuOpen;
    render();
  });
  document.addEventListener("click", function (e) {
    if (state.menuOpen && !menuPanel.contains(e.target) && e.target !== menuBtn) {
      state.menuOpen = false;
      render();
    }
  });

  function runSearch(query) {
    searchResults.innerHTML = "";
    var q = query.trim().toLowerCase();
    if (!q) {
      searchResults.innerHTML = '<div class="search-empty">הקלידו כדי לחפש</div>';
      return;
    }
    var matches = [];
    data.sheets.forEach(function (sheet) {
      sheet.tasks.forEach(function (t) {
        if (t.text.toLowerCase().indexOf(q) !== -1) {
          matches.push({ task: t, sheetId: sheet.id, sheetName: sheet.name });
        }
      });
    });
    matches.sort(function (a, b) { return b.task.createdAt - a.task.createdAt; });
    matches = matches.slice(0, 30);
    if (!matches.length) {
      searchResults.innerHTML = '<div class="search-empty">לא נמצאו תוצאות</div>';
      return;
    }
    matches.forEach(function (m) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "search-result";

      var textEl = document.createElement("span");
      textEl.className = "search-result-text";
      textEl.textContent = m.task.text;

      var metaEl = document.createElement("span");
      metaEl.className = "search-result-meta";
      metaEl.textContent = m.sheetName + " · " + isoToFullDisplay(m.task.date);

      btn.appendChild(textEl);
      btn.appendChild(metaEl);
      btn.addEventListener("click", function () {
        data.activeSheetId = m.sheetId;
        state.viewDate = m.task.date;
        state.filter = "all";
        closeSearch();
        render();
      });
      searchResults.appendChild(btn);
    });
  }

  function openSearch() {
    state.searchOpen = true;
    searchPanel.hidden = false;
    searchBtn.setAttribute("aria-expanded", "true");
    runSearch(searchInput.value);
    searchInput.focus();
  }
  function closeSearch() {
    state.searchOpen = false;
    searchPanel.hidden = true;
    searchBtn.setAttribute("aria-expanded", "false");
  }

  searchBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (state.searchOpen) {
      closeSearch();
    } else {
      state.menuOpen = false;
      menuPanel.hidden = true;
      menuBtn.setAttribute("aria-expanded", "false");
      openSearch();
    }
  });
  searchInput.addEventListener("click", function (e) { e.stopPropagation(); });
  searchInput.addEventListener("input", function () { runSearch(searchInput.value); });
  searchInput.addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.key === "Escape") closeSearch();
  });
  document.addEventListener("click", function (e) {
    if (state.searchOpen && !searchPanel.contains(e.target) && e.target !== searchBtn) {
      closeSearch();
    }
  });

  function renderSheetsBar() {
    sheetsBar.innerHTML = "";
    data.sheets.forEach(function (sheet) {
      var tab = document.createElement("div");
      tab.className = "sheet-tab" + (sheet.id === data.activeSheetId ? " active" : "");

      if (state.renamingSheetId === sheet.id) {
        var input = document.createElement("input");
        input.className = "rename-input";
        input.value = sheet.name;
        input.maxLength = 40;
        input.addEventListener("click", function (e) { e.stopPropagation(); });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { commitRename(sheet.id, input.value); }
          if (e.key === "Escape") { state.renamingSheetId = null; render(); }
        });
        input.addEventListener("blur", function () { commitRename(sheet.id, input.value); });
        tab.appendChild(input);
        sheetsBar.appendChild(tab);
        input.focus();
        input.select();
        return;
      }

      var label = document.createElement("span");
      label.className = "sheet-tab-label";
      label.textContent = sheet.name;
      tab.appendChild(label);
      tab.title = sheet.id === data.activeSheetId ? "לחצו לשינוי שם" : sheet.name;
      tab.addEventListener("click", function () {
        if (sheet.id === data.activeSheetId) {
          state.renamingSheetId = sheet.id;
          render();
        } else {
          selectSheet(sheet.id);
        }
      });
      tab.addEventListener("dblclick", function (e) {
        e.stopPropagation();
        data.activeSheetId = sheet.id;
        state.renamingSheetId = sheet.id;
        render();
      });
      sheetsBar.appendChild(tab);

      var tabStyle = getComputedStyle(tab);
      var availableWidth = tab.clientWidth - parseFloat(tabStyle.paddingLeft) - parseFloat(tabStyle.paddingRight);
      var overflowPx = label.scrollWidth - availableWidth;
      if (overflowPx > 2) {
        var gapPx = 24;
        var track = document.createElement("span");
        track.className = "sheet-tab-marquee-track";
        tab.insertBefore(track, label);
        track.appendChild(label);
        var clone = label.cloneNode(true);
        clone.classList.add("sheet-tab-label-clone");
        clone.setAttribute("aria-hidden", "true");
        track.appendChild(clone);

        var segment = label.scrollWidth + gapPx;
        track.style.setProperty("--marquee-segment", segment + "px");
        track.style.animationDuration = Math.max(4, segment / 40) + "s";
      }
    });

    var addBtn = document.createElement("button");
    addBtn.className = "sheet-tab add-sheet-tab";
    addBtn.type = "button";
    addBtn.title = "הוספת פרויקט";
    addBtn.textContent = "+";
    addBtn.addEventListener("click", addSheet);
    sheetsBar.appendChild(addBtn);
  }

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = taskInput.value.trim();
    if (!text) return;
    activeSheet().tasks.push({
      id: uid(),
      text: text,
      status: 0,
      urgent: false,
      date: state.viewDate,
      createdAt: Date.now()
    });
    saveData();
    taskInput.value = "";
    render();
    taskInput.focus();
  });

  filterButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filterButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.filter = btn.dataset.filter;
      render();
    });
  });

  function cycleStatus(id) {
    var t = activeSheet().tasks.find(function (x) { return x.id === id; });
    if (t) {
      t.status = (t.status + 1) % 3;
      saveData();
      render();
    }
  }

  function removeTask(id) {
    var sheet = activeSheet();
    sheet.tasks = sheet.tasks.filter(function (x) { return x.id !== id; });
    saveData();
    render();
  }

  function toggleUrgent(id) {
    var t = activeSheet().tasks.find(function (x) { return x.id === id; });
    if (t) {
      t.urgent = !t.urgent;
      saveData();
      render();
    }
  }

  function commitTaskText(id, value) {
    var t = activeSheet().tasks.find(function (x) { return x.id === id; });
    var trimmed = value.trim();
    if (t && trimmed) {
      t.text = trimmed.slice(0, 200);
    }
    state.editingTaskId = null;
    saveData();
    render();
  }

  var URGENT_CIRCLE_SVG = '<svg viewBox="0 0 11 11" xmlns="http://www.w3.org/2000/svg"><circle cx="5.5" cy="5.5" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';

  function render() {
    renderSheetsBar();

    menuPanel.hidden = !state.menuOpen;
    menuBtn.setAttribute("aria-expanded", String(state.menuOpen));
    filterButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.filter === state.filter); });

    var STATUS_LABEL = { 0: "לחצו כדי לסמן טיפול חלקי", 1: "לחצו כדי לסמן כהושלם", 2: "לחצו כדי לאפס" };

    var today = todayISO();
    var isToday = state.viewDate === today;
    var isPast = state.viewDate < today;
    var isFuture = state.viewDate > today;
    var editable = !isPast;
    dateLabel.textContent = isoToFullDisplay(state.viewDate);
    dateInput.value = state.viewDate;
    todayBtn.hidden = isToday;
    addForm.hidden = isPast;

    var sheetTasks = activeSheet().tasks.filter(function (t) { return t.date === state.viewDate; });
    var sorted = sheetTasks.slice().sort(function (a, b) {
      return a.createdAt - b.createdAt;
    });

    var visible = sorted.filter(function (t) {
      if (state.filter === "active") return t.status !== 2;
      if (state.filter === "done") return t.status === 2;
      return true;
    });

    taskList.innerHTML = "";
    visible.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "task" + (t.status === 1 ? " partial" : "") + (t.status === 2 ? " done" : "") + (editable ? "" : " readonly");
      var longPressFired = false;
      if (editable) {
        li.addEventListener("click", function () {
          if (longPressFired) { longPressFired = false; return; }
          cycleStatus(t.id);
        });

        var pressTimer = null;
        var pressStartX = 0, pressStartY = 0;
        var startPress = function (e) {
          if (e.target.closest("input, button")) return;
          var point = e.touches ? e.touches[0] : e;
          pressStartX = point.clientX;
          pressStartY = point.clientY;
          longPressFired = false;
          clearTimeout(pressTimer);
          pressTimer = setTimeout(function () {
            longPressFired = true;
            openMoveTaskModal(t.id);
          }, 550);
        };
        var cancelPress = function () {
          clearTimeout(pressTimer);
        };
        var movePress = function (e) {
          var point = e.touches ? e.touches[0] : e;
          if (Math.abs(point.clientX - pressStartX) > 10 || Math.abs(point.clientY - pressStartY) > 10) {
            cancelPress();
          }
        };
        li.addEventListener("mousedown", startPress);
        li.addEventListener("mouseup", cancelPress);
        li.addEventListener("mouseleave", cancelPress);
        li.addEventListener("mousemove", movePress);
        li.addEventListener("touchstart", startPress, { passive: true });
        li.addEventListener("touchend", cancelPress);
        li.addEventListener("touchmove", movePress, { passive: true });
      }

      var check = document.createElement("span");
      check.className = "row-mark";
      check.setAttribute("aria-hidden", "true");
      check.title = STATUS_LABEL[t.status];
      check.innerHTML = rowMarkSvg(t.status);

      var dot = document.createElement("span");
      dot.className = "urgent-toggle" + (t.urgent ? " urgent" : "");
      dot.title = t.urgent ? "לחצו לביטול הדחיפות" : "לחצו לסימון כדחוף";
      dot.innerHTML = t.urgent ? "" : URGENT_CIRCLE_SVG;
      if (editable) {
        dot.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleUrgent(t.id);
        });
      }

      var textEl;
      if (editable && state.editingTaskId === t.id) {
        textEl = document.createElement("input");
        textEl.type = "text";
        textEl.className = "task-text-input";
        textEl.value = t.text;
        textEl.maxLength = 200;
        var editResolved = false;
        textEl.addEventListener("click", function (e) { e.stopPropagation(); });
        textEl.addEventListener("keydown", function (e) {
          e.stopPropagation();
          if (e.key === "Enter") {
            editResolved = true;
            commitTaskText(t.id, textEl.value);
          }
          if (e.key === "Escape") {
            editResolved = true;
            state.editingTaskId = null;
            render();
          }
        });
        textEl.addEventListener("blur", function () {
          if (!editResolved) {
            editResolved = true;
            commitTaskText(t.id, textEl.value);
          }
        });
      } else {
        textEl = document.createElement("span");
        textEl.className = "task-text";
        textEl.textContent = t.text;
        textEl.title = t.text;
        if (editable) {
          textEl.addEventListener("click", function (e) {
            e.stopPropagation();
            state.editingTaskId = t.id;
            render();
          });
        }
      }

      var actions = document.createElement("span");
      actions.className = "task-actions";
      if (!editable) actions.hidden = true;
      var delBtn = document.createElement("button");
      delBtn.innerHTML = "&#10005;";
      delBtn.title = "מחיקה";
      delBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        askConfirm('למחוק את השורה "' + t.text + '"?', function () {
          removeTask(t.id);
        });
      });
      actions.appendChild(delBtn);

      var lead = document.createElement("span");
      lead.className = "row-lead";
      lead.appendChild(dot);
      lead.appendChild(check);

      li.appendChild(lead);
      li.appendChild(textEl);
      if (t.status === 2 && t.date) {
        var dateBadge = document.createElement("span");
        dateBadge.className = "row-date";
        dateBadge.textContent = isoToDisplay(t.date);
        dateBadge.title = "הושלם בתאריך " + isoToDisplay(t.date);
        li.appendChild(dateBadge);
      }
      li.appendChild(actions);
      taskList.appendChild(li);

      if (state.editingTaskId === t.id) {
        textEl.focus();
        textEl.select();
      }
    });

    emptyState.textContent = isToday
      ? "אין שורות בפרויקט הזה עדיין"
      : isFuture
        ? "אין עדיין משימות מתוכננות לתאריך הזה"
        : "אין שורות מהתאריך הזה בפרויקט הזה";
    emptyState.style.display = visible.length ? "none" : "block";

    var total = sheetTasks.length;
    var doneCount = sheetTasks.filter(function (t) { return t.status === 2; }).length;
    progressText.textContent = doneCount + "/" + total + " הושלמו";
  }

  function loadFromLocalOrDefault() {
    return loadLocalData() || defaultData();
  }

  function startLocalOnly() {
    data = loadFromLocalOrDefault();
    if (applyDailyRollover(data)) saveData();
    render();
  }

  function startWithSupabase() {
    supabaseClient.from("app_state").select("data").eq("id", SUPABASE_ROW_ID).maybeSingle()
      .then(function (result) {
        var row = result && result.data;
        var remote = row && row.data ? normalizeData(row.data) : null;
        data = remote || loadFromLocalOrDefault();
        var rolled = applyDailyRollover(data);
        if (rolled || !remote) saveData();
        render();
      }, startLocalOnly)
      .catch(startLocalOnly);
  }

  var authGate = document.getElementById("authGate");
  var appRoot = document.getElementById("appRoot");
  var authForm = document.getElementById("authForm");
  var authUsername = document.getElementById("authUsername");
  var authPassword = document.getElementById("authPassword");
  var authError = document.getElementById("authError");
  var authLoginBtn = document.getElementById("authLoginBtn");
  var authSignupBtn = document.getElementById("authSignupBtn");
  var logoutBtn = document.getElementById("logoutBtn");
  var menuUsernameLabel = document.getElementById("menuUsernameLabel");

  function showApp(user) {
    SUPABASE_ROW_ID = user.id;
    var uname = (user.email || "").split("@")[0];
    currentUsername = uname;
    menuUsernameLabel.textContent = "מחובר/ת בתור " + uname;
    authGate.hidden = true;
    appRoot.hidden = false;
    startWithSupabase();
  }

  function showAuthGate() {
    appRoot.hidden = true;
    authGate.hidden = false;
  }

  function setAuthBusy(busy) {
    authLoginBtn.disabled = busy;
    authSignupBtn.disabled = busy;
  }
  function showAuthError(msg) {
    authError.textContent = msg;
    authError.hidden = false;
  }
  function clearAuthError() {
    authError.hidden = true;
  }

  if (!supabaseClient) {
    appRoot.hidden = false;
    authGate.hidden = true;
    document.getElementById("accountMenuSection").hidden = true;
    startLocalOnly();
  } else {
    supabaseClient.auth.getSession().then(function (result) {
      var session = result && result.data && result.data.session;
      if (session && session.user) {
        showApp(session.user);
      } else {
        showAuthGate();
      }
    }).catch(showAuthGate);

    authForm.addEventListener("submit", function (e) {
      e.preventDefault();
      clearAuthError();
      var username = authUsername.value.trim();
      var password = authPassword.value;
      if (!username || !password) return;
      setAuthBusy(true);
      supabaseClient.auth.signInWithPassword({ email: usernameToEmail(username), password: password })
        .then(function (result) {
          setAuthBusy(false);
          if (result.error) {
            showAuthError("שם משתמש או סיסמה שגויים");
            return;
          }
          showApp(result.data.user);
        }, function () {
          setAuthBusy(false);
          showAuthError("שגיאת התחברות. בדקו את החיבור לאינטרנט.");
        });
    });

    authSignupBtn.addEventListener("click", function () {
      clearAuthError();
      var username = authUsername.value.trim();
      var password = authPassword.value;
      if (!username || !password || password.length < 6) {
        showAuthError("מלאו שם משתמש וסיסמה (לפחות 6 תווים)");
        return;
      }
      setAuthBusy(true);
      supabaseClient.auth.signUp({ email: usernameToEmail(username), password: password })
        .then(function (result) {
          setAuthBusy(false);
          if (result.error) {
            var already = result.error.message && result.error.message.toLowerCase().indexOf("already") !== -1;
            showAuthError(already ? "שם המשתמש הזה כבר תפוס" : "שגיאה בהרשמה");
            return;
          }
          if (result.data.session && result.data.user) {
            showApp(result.data.user);
          } else {
            showAuthError("ההרשמה בוצעה. נסו להתחבר עכשיו.");
          }
        }, function () {
          setAuthBusy(false);
          showAuthError("שגיאת הרשמה. בדקו את החיבור לאינטרנט.");
        });
    });

    logoutBtn.addEventListener("click", function () {
      supabaseClient.auth.signOut().then(function () { location.reload(); }, function () { location.reload(); });
    });

    var changeUsernameBtn = document.getElementById("changeUsernameBtn");
    var changeUsernameOverlay = document.getElementById("changeUsernameOverlay");
    var newUsernameInput = document.getElementById("newUsernameInput");
    var changeUsernameError = document.getElementById("changeUsernameError");
    var changeUsernameSaveBtn = document.getElementById("changeUsernameSaveBtn");
    var changeUsernameCancelBtn = document.getElementById("changeUsernameCancelBtn");
    var currentUsername = "";

    function showChangeUsernameError(msg) {
      changeUsernameError.textContent = msg;
      changeUsernameError.hidden = false;
    }
    function closeChangeUsername() {
      changeUsernameOverlay.hidden = true;
      changeUsernameError.hidden = true;
      changeUsernameSaveBtn.disabled = false;
    }

    changeUsernameBtn.addEventListener("click", function () {
      state.menuOpen = false;
      render();
      changeUsernameError.hidden = true;
      newUsernameInput.value = currentUsername;
      changeUsernameOverlay.hidden = false;
      newUsernameInput.focus();
      newUsernameInput.select();
    });
    changeUsernameCancelBtn.addEventListener("click", closeChangeUsername);
    changeUsernameOverlay.addEventListener("click", function (e) {
      if (e.target === changeUsernameOverlay) closeChangeUsername();
    });
    newUsernameInput.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeChangeUsername();
      if (e.key === "Enter") { e.preventDefault(); changeUsernameSaveBtn.click(); }
    });
    changeUsernameSaveBtn.addEventListener("click", function () {
      var newUsername = newUsernameInput.value.trim();
      changeUsernameError.hidden = true;
      if (!newUsername) {
        showChangeUsernameError("יש להזין שם משתמש");
        return;
      }
      if (newUsername === currentUsername) {
        closeChangeUsername();
        return;
      }
      changeUsernameSaveBtn.disabled = true;
      supabaseClient.auth.updateUser({ email: usernameToEmail(newUsername) })
        .then(function (result) {
          changeUsernameSaveBtn.disabled = false;
          if (result.error) {
            var already = result.error.message && result.error.message.toLowerCase().indexOf("already") !== -1;
            showChangeUsernameError(already ? "שם המשתמש הזה כבר תפוס" : "שגיאה בשינוי שם המשתמש");
            return;
          }
          currentUsername = newUsername;
          menuUsernameLabel.textContent = "מחובר/ת בתור " + newUsername;
          closeChangeUsername();
        }, function () {
          changeUsernameSaveBtn.disabled = false;
          showChangeUsernameError("שגיאת רשת. בדקו את החיבור לאינטרנט.");
        });
    });
  }

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("tasks-sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
